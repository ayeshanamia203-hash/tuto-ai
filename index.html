<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Tuto AI</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
>

<script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js">
</script>

<script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css"
>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js">
</script>


<style>

:root[data-theme="dark"] {

    --bg:#131314;
    --side:#1e1e20;
    --text:#ffffff;
    --muted:#b8b8b8;
    --accent:#a8c7fa;
    --border:#2d2d30;
    --input:#1e1e20;
    --hover:#2b2a33;
}

:root[data-theme="light"] {

    --bg:#ffffff;
    --side:#f0f4f9;
    --text:#1f1f1f;
    --muted:#555555;
    --accent:#0b57d0;
    --border:#e1e3e1;
    --input:#f0f4f9;
    --hover:#e3e3e3;
}

* {
    box-sizing:border-box;
}

html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:var(--bg);
    color:var(--text);

    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;
}

body {
    display:flex;
}


/* SIDEBAR */

.sidebar {

    width:260px;
    height:100%;

    background:var(--side);

    border-right:
        1px solid var(--border);

    padding:20px;

    display:flex;
    flex-direction:column;

    flex-shrink:0;

    transition:.3s;

    z-index:1000;
}

.sidebar.collapsed {
    margin-left:-260px;
}

.sidebar-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.5);

    z-index:999;
}

.new-chat-btn {

    background:var(--input);

    color:var(--text);

    border:
        1px solid var(--border);

    border-radius:30px;

    padding:10px 15px;

    font-weight:500;
}

.history-list {

    flex:1;

    overflow-y:auto;

    margin-top:15px;
}

.history-item {

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 12px;

    border-radius:10px;

    color:var(--muted);

    cursor:pointer;

    margin-bottom:5px;

    font-size:14px;
}

.history-item:hover,
.history-item.active {

    background:var(--hover);

    color:var(--text);
}

.history-title {

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:160px;
}

.action-btns-group {

    display:none;

    gap:6px;
}

.history-item.show-actions
.action-btns-group {

    display:flex;
}

.action-icon-btn {

    border:0;

    background:transparent;

    cursor:pointer;
}

.delete-btn-icon {
    color:#e11d48;
}

.star-btn-icon {
    color:#f59e0b;
}


/* MAIN */

.main-chat {

    flex:1;

    width:100%;

    height:100vh;
    height:100dvh;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}

.chat-header {

    padding:15px 25px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    flex-shrink:0;
}

.header-left {

    display:flex;

    align-items:center;

    gap:8px;
}

.toggle-btn,
.theme-btn {

    background:transparent;

    color:var(--text);

    border:0;

    cursor:pointer;

    padding:8px 12px;

    border-radius:20px;
}

.theme-btn {

    border:
        1px solid var(--border);
}


/* CHAT */

.chat-container {

    flex:1;

    overflow-y:auto;

    padding:20px;

    width:100%;

    max-width:900px;

    margin:auto;
}

.welcome-screen {

    min-height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;
}

.welcome-avatar,
.ai-avatar {

    width:38px;
    height:38px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;
}

.welcome-avatar {

    width:58px;
    height:58px;

    margin-bottom:15px;

    font-size:20px;
}

.message {

    display:flex;

    gap:15px;

    margin-bottom:28px;
}

.avatar {

    width:35px;
    height:35px;

    border-radius:50%;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:12px;

    font-weight:bold;
}

.user-avatar {

    background:#5436da;

    color:white;
}

.bubble {

    width:100%;

    max-width:88%;

    color:var(--text);

    font-size:16px;

    line-height:1.65;

    word-wrap:break-word;
}

.bubble strong {

    color:var(--accent);
}

.bubble table {

    width:100%;

    border-collapse:collapse;

    margin:12px 0;
}

.bubble th,
.bubble td {

    border:
        1px solid var(--border);

    padding:8px;
}

.bubble th {

    background:var(--hover);
}


/* IMAGE */

.uploaded-img-preview {

    display:block;

    max-width:240px;

    max-height:320px;

    object-fit:contain;

    border-radius:12px;

    border:
        1px solid var(--border);

    margin-bottom:8px;
}


/* CODE */

.code-container {

    margin:12px 0;

    border-radius:8px;

    overflow:hidden;

    border:
        1px solid #3e4451;

    background:#282c34;
}

.code-header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#21252b;

    padding:6px 12px;

    font-size:12px;

    color:#abb2bf;
}

pre {

    margin:0 !important;

    padding:12px !important;

    overflow-x:auto;
}

.copy-code-btn {

    background:#3e4451;

    color:white;

    border:0;

    border-radius:4px;

    padding:3px 8px;

    cursor:pointer;
}


/* INPUT */

.input-container-box {

    width:100%;

    padding:
        10px 15px 15px;

    background:var(--bg);

    flex-shrink:0;
}

.input-wrapper {

    width:100%;

    max-width:850px;

    margin:auto;

    background:var(--input);

    border:
        1px solid var(--border);

    border-radius:24px;

    padding:8px 15px;
}

#filePreviewArea {

    display:none;

    position:relative;

    width:max-content;

    margin-bottom:8px;
}

#previewImgThumb {

    width:75px;
    height:75px;

    object-fit:cover;

    border-radius:12px;
}

.close-img-btn {

    position:absolute;

    top:-7px;
    right:-7px;

    width:22px;
    height:22px;

    border:0;

    border-radius:50%;

    background:#e11d48;

    color:white;

    cursor:pointer;
}

.pdf-preview {

    background:var(--hover);

    border:
        1px solid #e11d48;

    color:#ff4d4d;

    padding:8px 12px;

    border-radius:10px;
}

.input-row {

    display:flex;

    align-items:center;

    gap:10px;
}

.plus-btn,
.mic-btn {

    background:none;

    border:0;

    color:var(--accent);

    font-size:18px;

    cursor:pointer;

    padding:5px;
}

.mic-btn.recording {

    color:#ef4444 !important;

    animation:pulse 1.2s infinite;
}

@keyframes pulse {

    0% {
        transform:scale(1);
    }

    50% {
        transform:scale(1.2);
    }

    100% {
        transform:scale(1);
    }
}

.chat-textarea {

    background:transparent;

    border:0;

    outline:0;

    color:var(--text);

    width:100%;

    resize:none;

    min-height:28px;

    max-height:120px;

    padding:6px 0;

    font-size:15px;

    font-family:inherit;
}

.send-btn {

    width:32px;
    height:32px;

    border-radius:50%;

    border:0;

    background:var(--text);

    color:var(--bg);

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}

.send-btn:disabled {

    background:var(--border);

    color:var(--muted);

}

.tts-btn {

    background:none;

    border:0;

    color:var(--muted);

    cursor:pointer;
}


/* MOBILE */

@media(max-width:768px) {

    .sidebar {

        position:absolute;

        top:0;
        bottom:0;
        left:0;

        box-shadow:
            5px 0 15px rgba(0,0,0,.3);
    }

    .sidebar-overlay.active {

        display:block;
    }

    .chat-container {

        padding:
            15px 10px;
    }

    .chat-header {

        padding:
            12px 15px;
    }

    .bubble {

        max-width:calc(100vw - 80px);

    }

}

</style>

</head>


<body>


<div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="toggleSidebar()">
</div>


<!-- SIDEBAR -->

<div
    class="sidebar"
    id="sidebar">

    <button
        class="new-chat-btn w-100"
        onclick="startNewChat()">

        <i class="fa-solid fa-plus me-2"></i>

        New Chat

    </button>

    <div
        class="history-list"
        id="historyList">
    </div>

</div>


<!-- MAIN -->

<div class="main-chat">


    <div class="chat-header">

        <div class="header-left">

            <button
                class="toggle-btn"
                onclick="toggleSidebar()">

                <i class="fa-solid fa-bars"></i>

            </button>

            <h5 class="m-0 fw-bold">

                <i
                    class="fa-solid fa-sparkles me-2 text-warning">
                </i>

                Tuto AI

            </h5>

        </div>


        <button
            class="theme-btn"
            onclick="toggleTheme()">

            <i
                class="fa-solid fa-sun"
                id="themeIcon">
            </i>

            <span id="themeText">
                Light
            </span>

        </button>

    </div>


    <div
        class="chat-container"
        id="chatBox">
    </div>


    <!-- INPUT -->

    <div class="input-container-box">

        <div class="input-wrapper">


            <div id="filePreviewArea">

                <img
                    id="previewImgThumb"
                    src=""
                    style="display:none;"
                    alt="preview"
                >

                <div
                    id="pdfPreviewThumb"
                    class="pdf-preview"
                    style="display:none;">

                    <i
                        class="fa-solid fa-file-pdf me-2">
                    </i>

                    <span id="pdfFileName">
                        document.pdf
                    </span>

                </div>


                <button
                    class="close-img-btn"
                    onclick="clearSelectedFile()">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <div class="input-row">


                <button
                    class="plus-btn"
                    data-bs-toggle="modal"
                    data-bs-target="#uploadModal">

                    <i
                        class="fa-solid fa-circle-plus">
                    </i>

                </button>


                <form
                    id="chatForm"
                    class="d-flex w-100 align-items-center gap-2">


                    <textarea
                        id="question"
                        class="chat-textarea"
                        rows="1"
                        placeholder="Message Tuto AI...">
                    </textarea>


                    <button
                        type="button"
                        class="mic-btn"
                        id="micBtn"
                        onclick="toggleVoiceRecording()">

                        <i
                            class="fa-solid fa-microphone">
                        </i>

                    </button>


                    <button
                        type="submit"
                        class="send-btn"
                        id="sendBtn">

                        <i
                            class="fa-solid fa-arrow-up">
                        </i>

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>


<!-- FILE INPUTS -->

<input
    type="file"
    id="galleryInput"
    accept="image/*"
    style="display:none"
    onchange="handleFileSelect(this)"
>

<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    style="display:none"
    onchange="handleFileSelect(this)"
>

<input
    type="file"
    id="pdfInput"
    accept="application/pdf"
    style="display:none"
    onchange="handleFileSelect(this)"
>


<!-- UPLOAD MODAL -->

<div
    class="modal fade"
    id="uploadModal"
    tabindex="-1">

    <div
        class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i
                        class="fa-solid fa-paperclip me-2">
                    </i>

                    Attach File

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <button
                    class="btn btn-outline-warning w-100 mb-2"
                    onclick="triggerCamera()">

                    <i
                        class="fa-solid fa-camera me-2">
                    </i>

                    Take Photo

                </button>


                <button
                    class="btn btn-outline-info w-100 mb-2"
                    onclick="triggerGallery()">

                    <i
                        class="fa-solid fa-images me-2">
                    </i>

                    Upload Photo

                </button>


                <button
                    class="btn btn-outline-danger w-100"
                    onclick="triggerPDF()">

                    <i
                        class="fa-solid fa-file-pdf me-2">
                    </i>

                    Upload PDF

                </button>

            </div>

        </div>

    </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>


<script>


/* =====================================================
   GLOBAL
===================================================== */

let selectedFile = null;

let previewDataURL = null;

let uploadedFileName = null;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


const questionInput =
    document.getElementById("question");

const chatBox =
    document.getElementById("chatBox");

const historyList =
    document.getElementById("historyList");

const micBtn =
    document.getElementById("micBtn");


/* =====================================================
   STORAGE
===================================================== */

let allSessions =
    JSON.parse(
        localStorage.getItem(
            "tuto_all_sessions"
        )
    ) || {};


let currentSessionId =
    localStorage.getItem(
        "tuto_current_session_id"
    ) || null;


/* =====================================================
   WELCOME
===================================================== */

const DEFAULT_WELCOME = `

<div class="welcome-screen">

    <div class="welcome-avatar">
        AI
    </div>

    <h2 class="fw-bold mb-2">
        Hello there!
    </h2>

    <p class="text-secondary fs-5">
        How can I help you today?
    </p>

    <small class="text-secondary">
        Ask me anything — study, coding,
        writing, math, science,
        technology and more.
    </small>

</div>

`;


/* =====================================================
   THEME
===================================================== */

function initTheme() {

    const theme =
        localStorage.getItem(
            "tuto_theme"
        ) || "dark";

    setTheme(theme);
}


function toggleTheme() {

    const current =
        document.documentElement
        .getAttribute(
            "data-theme"
        );

    setTheme(
        current === "dark"
            ? "light"
            : "dark"
    );
}


function setTheme(theme) {

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );

    localStorage.setItem(
        "tuto_theme",
        theme
    );

    const icon =
        document.getElementById(
            "themeIcon"
        );

    const text =
        document.getElementById(
            "themeText"
        );


    if(theme === "light") {

        icon.className =
            "fa-solid fa-moon";

        text.innerText =
            "Dark";

    } else {

        icon.className =
            "fa-solid fa-sun";

        text.innerText =
            "Light";
    }
}


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar() {

    const sidebar =
        document.getElementById(
            "sidebar"
        );

    const overlay =
        document.getElementById(
            "sidebarOverlay"
        );

    sidebar.classList.toggle(
        "collapsed"
    );


    if(window.innerWidth <= 768) {

        if(
            sidebar.classList.contains(
                "collapsed"
            )
        ) {

            overlay.classList.remove(
                "active"
            );

        } else {

            overlay.classList.add(
                "active"
            );
        }
    }
}


function mobileSidebarCheck() {

    if(window.innerWidth <= 768) {

        document
            .getElementById("sidebar")
            .classList.add(
                "collapsed"
            );

    }
}


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        initTheme();

        mobileSidebarCheck();


        if(
            !currentSessionId ||
            !allSessions[currentSessionId]
        ) {

            startNewChat(false);

        } else {

            renderSidebarHistory();

            loadSession(
                currentSessionId
            );

        }

    }
);


/* =====================================================
   TEXTAREA
===================================================== */

questionInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            this.scrollHeight + "px";

    }
);


questionInput.addEventListener(
    "keydown",
    function(e) {

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ) {

            e.preventDefault();

            document
                .getElementById(
                    "chatForm"
                )
                .dispatchEvent(
                    new Event(
                        "submit"
                    )
                );

        }

    }
);


/* =====================================================
   MATH
===================================================== */

function renderMath(element) {

    if(!window.renderMathInElement)
        return;

    try {

        renderMathInElement(
            element,
            {

                delimiters: [

                    {
                        left:"$$",
                        right:"$$",
                        display:true
                    },

                    {
                        left:"$",
                        right:"$",
                        display:false
                    },

                    {
                        left:"\\(",
                        right:"\\)",
                        display:false
                    },

                    {
                        left:"\\[",
                        right:"\\]",
                        display:true
                    }

                ],

                throwOnError:false

            }
        );

    } catch(e) {}

}


/* =====================================================
   CODE
===================================================== */

function processCodeBlocks(element) {

    if(!element)
        return;

    element
        .querySelectorAll("pre")
        .forEach(
            pre => {

                if(
                    pre.closest(
                        ".code-container"
                    )
                )
                    return;


                const code =
                    pre.querySelector(
                        "code"
                    );


                const codeText =
                    code
                        ? code.innerText
                        : pre.innerText;


                let language =
                    "code";


                if(
                    code &&
                    code.className
                ) {

                    const match =
                        code.className.match(
                            /language-(\w+)/
                        );

                    if(match)
                        language =
                            match[1];

                }


                const container =
                    document.createElement(
                        "div"
                    );

                container.className =
                    "code-container";


                const header =
                    document.createElement(
                        "div"
                    );

                header.className =
                    "code-header";


                const label =
                    document.createElement(
                        "span"
                    );

                label.innerText =
                    language;


                const copyBtn =
                    document.createElement(
                        "button"
                    );

                copyBtn.className =
                    "copy-code-btn";

                copyBtn.innerText =
                    "Copy";


                copyBtn.onclick =
                    async () => {

                        try {

                            await navigator
                                .clipboard
                                .writeText(
                                    codeText.trim()
                                );

                            copyBtn.innerText =
                                "Copied!";

                            setTimeout(
                                () => {
                                    copyBtn.innerText =
                                        "Copy";
                                },
                                1500
                            );

                        } catch(e) {}

                    };


                header.appendChild(
                    label
                );

                header.appendChild(
                    copyBtn
                );


                pre.parentNode.insertBefore(
                    container,
                    pre
                );

                container.appendChild(
                    header
                );

                container.appendChild(
                    pre
                );


                if(
                    window.hljs &&
                    code
                ) {

                    try {

                        hljs.highlightElement(
                            code
                        );

                    } catch(e) {}

                }

            }
        );
}


/* =====================================================
   SAVE
===================================================== */

function saveSessions() {

    localStorage.setItem(
        "tuto_all_sessions",
        JSON.stringify(
            allSessions
        )
    );

    localStorage.setItem(
        "tuto_current_session_id",
        currentSessionId
    );
}


/* =====================================================
   NEW CHAT
===================================================== */

function startNewChat(
    render = true
) {

    currentSessionId =
        "session_" +
        Date.now();


    allSessions[
        currentSessionId
    ] = {

        title:"New Chat",

        html:DEFAULT_WELCOME,

        isPinned:false

    };


    saveSessions();


    if(render) {

        renderSidebarHistory();

        loadSession(
            currentSessionId
        );

    }


    mobileSidebarCheck();
}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadSession(id) {

    if(!allSessions[id])
        return;


    currentSessionId =
        id;


    saveSessions();


    chatBox.innerHTML =
        allSessions[id].html ||
        DEFAULT_WELCOME;


    chatBox
        .querySelectorAll(
            ".bubble"
        )
        .forEach(
            bubble => {

                renderMath(
                    bubble
                );

                processCodeBlocks(
                    bubble
                );

            }
        );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    renderSidebarHistory();

    mobileSidebarCheck();
}


/* =====================================================
   DELETE
===================================================== */

function deleteSession(
    event,
    id
) {

    event.stopPropagation();


    if(
        !confirm(
            "Delete this chat?"
        )
    )
        return;


    delete allSessions[id];


    const keys =
        Object.keys(
            allSessions
        );


    if(
        currentSessionId === id
    ) {

        if(keys.length) {

            currentSessionId =
                keys[keys.length - 1];

        } else {

            startNewChat(false);

        }

    }


    saveSessions();

    renderSidebarHistory();

    loadSession(
        currentSessionId
    );
}


/* =====================================================
   PIN
===================================================== */

function togglePin(
    event,
    id
) {

    event.stopPropagation();


    if(allSessions[id]) {

        allSessions[id].isPinned =
            !allSessions[id].isPinned;

        saveSessions();

        renderSidebarHistory();

    }
}


/* =====================================================
   SIDEBAR HISTORY
===================================================== */

function renderSidebarHistory() {

    historyList.innerHTML =
        "";


    const keys =
        Object.keys(
            allSessions
        ).reverse();


    keys.forEach(
        id => {

            const session =
                allSessions[id];


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item" +
                (
                    id === currentSessionId
                        ? " active"
                        : ""
                );


            item.onclick =
                () => loadSession(id);


            item.innerHTML = `

                <div
                    class="history-title">

                    <i
                        class="fa-regular fa-message me-2">
                    </i>

                    ${escapeHTML(
                        session.title
                    )}

                </div>

                <div>

                    <button
                        class="action-icon-btn delete-btn-icon"
                        onclick="deleteSession(event,'${id}')">

                        <i
                            class="fa-solid fa-trash-can">
                        </i>

                    </button>

                    <button
                        class="action-icon-btn star-btn-icon"
                        onclick="togglePin(event,'${id}')">

                        <i
                            class="${
                                session.isPinned
                                ? "fa-solid"
                                : "fa-regular"
                            } fa-star">
                        </i>

                    </button>

                </div>
            `;


            historyList.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.innerText =
        text || "";

    return div.innerHTML;
}


/* =====================================================
   VOICE
===================================================== */

async function toggleVoiceRecording() {

    if(isRecording) {

        stopRecording();

    } else {

        startRecording();

    }
}


async function startRecording() {

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        audioChunks = [];


        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                await transcribeAudio(
                    blob
                );

            };


        mediaRecorder.start();

        isRecording = true;

        micBtn.classList.add(
            "recording"
        );

        questionInput.placeholder =
            "Recording... Tap microphone to stop";

    } catch(error) {

        alert(
            "Microphone permission denied or unavailable."
        );

    }

}


function stopRecording() {

    if(
        mediaRecorder &&
        isRecording
    ) {

        mediaRecorder.stop();

        isRecording = false;

        micBtn.classList.remove(
            "recording"
        );

        questionInput.placeholder =
            "Processing voice...";

    }

}


async function transcribeAudio(
    blob
) {

    const formData =
        new FormData();


    formData.append(
        "audio",
        blob,
        "audio.webm"
    );


    try {

        const response =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            data.status ===
                "success" &&
            data.text
        ) {

            questionInput.value =
                data.text;


            questionInput.style.height =
                "auto";


            questionInput.style.height =
                questionInput.scrollHeight +
                "px";

        } else {

            alert(
                data.message ||
                "Voice recognition failed."
            );

        }

    } catch(error) {

        alert(
            "Could not connect to voice service."
        );

    } finally {

        questionInput.placeholder =
            "Message Tuto AI...";

    }

}

/* =====================================================
   IMAGE COMPRESS
===================================================== */

function compressImage(
    file
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxSize =
                                1600;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                    maxSize ||
                                height >
                                    maxSize
                            ) {

                                if(
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            maxSize /
                                            width
                                        );

                                    width =
                                        maxSize;

                                } else {

                                    width =
                                        Math.round(
                                            width *
                                            maxSize /
                                            height
                                        );

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                    .createElement(
                                        "canvas"
                                    );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas
                                    .getContext(
                                        "2d"
                                    );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if(!blob) {

                                        reject(
                                            "Compression failed"
                                        );

                                        return;

                                    }


                                    resolve(
                                        new File(
                                            [blob],
                                            "tuto-image.jpg",
                                            {
                                                type:
                                                    "image/jpeg"
                                            }
                                        )
                                    );

                                },

                                "image/jpeg",

                                0.78
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );
}


/* =====================================================
   IMAGE PREVIEW DATA
===================================================== */

function makePreview(
    file
) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );
}


/* =====================================================
   FILE SELECT
===================================================== */

async function handleFileSelect(
    input
) {

    if(
        !input.files ||
        !input.files[0]
    )
        return;


    const originalFile =
        input.files[0];


    uploadedFileName =
        originalFile.name;


    try {

        if(
            originalFile.type.startsWith(
                "image/"
            )
        ) {

            /*
             * Compress image first.
             * This keeps Groq request small.
             */

            selectedFile =
                await compressImage(
                    originalFile
                );


            previewDataURL =
                await makePreview(
                    selectedFile
                );


            document
                .getElementById(
                    "previewImgThumb"
                )
                .src =
                previewDataURL;


            document
                .getElementById(
                    "previewImgThumb"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "pdfPreviewThumb"
                )
                .style.display =
                "none";


        } else if(
            originalFile.type ===
            "application/pdf"
        ) {

            selectedFile =
                originalFile;

            previewDataURL =
                null;


            document
                .getElementById(
                    "previewImgThumb"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "pdfPreviewThumb"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "pdfFileName"
                )
                .innerText =
                originalFile.name;

        }


        document
            .getElementById(
                "filePreviewArea"
            )
            .style.display =
            "block";


    } catch(error) {

        console.error(
            error
        );

        alert(
            "Could not prepare the file."
        );

        clearSelectedFile();

    }

}

/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(button) {

    if(
        !("speechSynthesis" in window)
    ) {

        alert(
            "Voice output is not supported."
        );

        return;
    }


    const bubble =
        button.closest(
            ".bubble"
        );


    const text =
        bubble
            ? bubble.innerText
            : "";


    if(
        window.speechSynthesis
            .speaking
    ) {

        window.speechSynthesis.cancel();

        button.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';

        return;
    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if(
        /[\u0980-\u09FF]/.test(
            text
        )
    ) {

        utterance.lang =
            "bn-BD";

    } else {

        utterance.lang =
            "en-US";

    }


    button.innerHTML =
        '<i class="fa-solid fa-volume-xmark"></i>';


    utterance.onend =
        () => {

            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

        };


    window.speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   SEND CHAT
===================================================== */

document
    .getElementById(
        "chatForm"
    )
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const sendBtn =
                document.getElementById(
                    "sendBtn"
                );


            const question =
                questionInput.value.trim();


            if(
                !question &&
                !selectedFile
            )
                return;


            const fileForSend =
                selectedFile;


            const imageForDisplay =
                previewDataURL;


            const titleFileName =
                uploadedFileName;


            /* ------------------------------------------------
               USER MESSAGE
            ------------------------------------------------ */

            let userHTML = "";


            if(question) {

                userHTML += `

                    <strong>You</strong>

                    <br>

                    ${escapeHTML(
                        question
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}

                `;

            }


            if(fileForSend) {

                if(
                    fileForSend.type
                        ===
                    "application/pdf"
                ) {

                    userHTML =
                        `

                        <div
                            class="pdf-preview">

                            <i
                                class="fa-solid fa-file-pdf">
                            </i>

                            ${escapeHTML(
                                titleFileName
                            )}

                        </div>

                        ` +

                        (
                            userHTML
                                ? "<br>" +
                                  userHTML
                                : ""
                        );


                } else if(
                    imageForDisplay
                ) {

                    /*
                     * IMPORTANT:
                     * We use a Data URL instead of
                     * URL.createObjectURL().
                     *
                     * This makes the image survive
                     * refresh and localStorage session load.
                     */

                    userHTML =
                        `

                        <img
                            src="${imageForDisplay}"
                            class="uploaded-img-preview"
                            alt="Uploaded image"
                        >

                        ` +

                        (
                            userHTML
                                ? "<br>" +
                                  userHTML
                                : ""
                        );

                }

            }


            chatBox.innerHTML += `

                <div class="message">

                    <div class="avatar user-avatar">
                        You
                    </div>

                    <div class="bubble">

                        ${userHTML}

                    </div>

                </div>

            `;


            /* ------------------------------------------------
               FORM DATA
            ------------------------------------------------ */

            const formData =
                new FormData();


            formData.append(
                "question",
                question
            );


            formData.append(
                "session_id",
                currentSessionId
            );


            if(fileForSend) {

                formData.append(
                    "file",
                    fileForSend
                );

            }


            /* Clear UI file selection */

            selectedFile = null;

            previewDataURL = null;

            uploadedFileName = null;


            document
                .getElementById(
                    "filePreviewArea"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "galleryInput"
                )
                .value = "";


            document
                .getElementById(
                    "cameraInput"
                )
                .value = "";


            document
                .getElementById(
                    "pdfInput"
                )
                .value = "";


            questionInput.value = "";

            questionInput.style.height =
                "auto";


            sendBtn.disabled = true;


            chatBox.scrollTop =
                chatBox.scrollHeight;


            /* ------------------------------------------------
               LOADING
            ------------------------------------------------ */

            const loadingId =
                "loading-" +
                Date.now();


            chatBox.innerHTML += `

                <div
                    class="message"
                    id="${loadingId}">

                    <div class="avatar ai-avatar">
                        AI
                    </div>

                    <div
                        class="bubble text-secondary">

                        <i
                            class="fa-solid fa-circle-notch fa-spin me-2">
                        </i>

                        Thinking...

                    </div>

                </div>

            `;


            chatBox.scrollTop =
                chatBox.scrollHeight;


            /* ------------------------------------------------
               API
            ------------------------------------------------ */

            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method:"POST",
                            body:formData
                        }
                    );


                const data =
                    await response.json();


                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(
                    data.status ===
                    "success"
                ) {

                    let content =
                        data.response ||
                        "";


                    try {

                        content =
                            marked.parse(
                                content
                            );

                    } catch(error) {

                        content =
                            escapeHTML(
                                data.response
                            ).replace(
                                /\n/g,
                                "<br>"
                            );

                    }


                    const bubble =
                        loading.querySelector(
                            ".bubble"
                        );


                    bubble.innerHTML = `

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-1">

                            <strong>
                                Tuto AI
                            </strong>

                            <button
                                class="tts-btn"
                                onclick="speakText(this)"
                                title="Read Aloud">

                                <i
                                    class="fa-solid fa-volume-high">
                                </i>

                            </button>

                        </div>

                        <div>
                            ${content}
                        </div>

                    `;


                    processCodeBlocks(
                        bubble
                    );


                    renderMath(
                        bubble
                    );


                    /*
                     * SAVE FULL CHAT HTML.
                     *
                     * Because uploaded images are
                     * Data URLs, they remain after
                     * page refresh.
                     */

                    allSessions[
                        currentSessionId
                    ].html =
                        chatBox.innerHTML;


                    saveSessions();


                    /* ------------------------------------------------
                       TITLE
                    ------------------------------------------------ */

                    if(
                        allSessions[
                            currentSessionId
                        ].title ===
                        "New Chat"
                    ) {

                        generateTitle(
                            question ||
                            titleFileName ||
                            "Conversation"
                        );

                    }


                } else {

                    if(loading) {

                        loading.querySelector(
                            ".bubble"
                        ).innerHTML = `

                            <span
                                class="text-danger">

                                Error:
                                ${escapeHTML(
                                    data.message ||
                                    "Something went wrong."
                                )}

                            </span>

                        `;

                    }

                }


            } catch(error) {

                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(loading) {

                    loading.querySelector(
                        ".bubble"
                    ).innerHTML = `

                        <span
                            class="text-danger">

                            Server connection error.

                        </span>

                    `;

                }

            } finally {

                sendBtn.disabled =
                    false;

                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }

        }
    );


/* =====================================================
   TITLE GENERATOR
===================================================== */

async function generateTitle(
    prompt
) {

    try {

        const formData =
            new FormData();


        formData.append(
            "prompt",
            prompt
        );


        const response =
            await fetch(
                "/api/generate-title",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            data.status ===
                "success" &&
            data.title &&
            allSessions[
                currentSessionId
            ]
        ) {

            allSessions[
                currentSessionId
            ].title =
                data.title;


            saveSessions();

            renderSidebarHistory();

        }

    } catch(error) {

        console.error(
            "Title error:",
            error
        );

    }

}
