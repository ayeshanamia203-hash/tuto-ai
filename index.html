<style>

/* ============================================================
   THEME
============================================================ */

:root[data-theme="dark"] {

    --bg-color:#131314;
    --sidebar-bg:#1e1e20;
    --text-color:#ffffff;
    --text-muted:#b8b8b8;
    --accent-color:#a8c7fa;
    --border-color:#2d2d30;
    --input-bg:#1e1e20;
    --input-border:#3c4043;
    --btn-hover:#2b2a33;
    --bubble-text:#ffffff;
    --strong-color:#a8c7fa;
    --modal-bg:#1e1e20;
    --menu-bg:#29292c;

}


:root[data-theme="light"] {

    --bg-color:#ffffff;
    --sidebar-bg:#f0f4f9;
    --text-color:#1f1f1f;
    --text-muted:#555555;
    --accent-color:#0b57d0;
    --border-color:#e1e3e1;
    --input-bg:#f0f4f9;
    --input-border:#c4c7c5;
    --btn-hover:#e3e3e3;
    --bubble-text:#1f1f1f;
    --strong-color:#0b57d0;
    --modal-bg:#ffffff;
    --menu-bg:#ffffff;

}


* {
    box-sizing:border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:var(--bg-color);

    color:var(--text-color);

    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;

}


body {
    display:flex;
}


/* ============================================================
   SIDEBAR
============================================================ */

.sidebar {

    width:260px;

    height:100%;

    background:var(--sidebar-bg);

    border-right:
        1px solid var(--border-color);

    padding:20px;

    display:flex;

    flex-direction:column;

    flex-shrink:0;

    transition:all .25s ease;

    z-index:1000;

}


.sidebar.collapsed {
    margin-left:-260px;
}


.sidebar-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.5);

    z-index:999;

}


.new-chat-btn {

    background:var(--input-bg);

    color:var(--text-color);

    border:
        1px solid var(--border-color);

    border-radius:30px;

    padding:10px 15px;

    font-weight:500;

}


.history-list {

    flex:1;

    overflow-y:auto;

    margin-top:15px;

}


.history-label {

    color:var(--text-muted);

    font-size:11px;

    font-weight:700;

    margin:15px 8px 8px;

}


.history-item {

    display:flex;

    align-items:center;

    padding:11px 12px;

    border-radius:10px;

    color:var(--text-muted);

    cursor:pointer;

    font-size:14px;

    margin-bottom:5px;

    user-select:none;

    position:relative;

}


.history-item:hover,
.history-item.active {

    background:var(--btn-hover);

    color:var(--text-color);

}


.history-title {

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    width:100%;

}


.pinned-icon {

    color:#f59e0b;

    margin-left:5px;

}


/* ============================================================
   CONTEXT MENU
============================================================ */

.chat-context-menu {

    display:none;

    position:fixed;

    min-width:190px;

    background:var(--menu-bg);

    border:
        1px solid var(--border-color);

    border-radius:13px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);

    padding:7px;

    z-index:5000;

}


.chat-context-menu.show {
    display:block;
}


.context-item {

    display:flex;

    align-items:center;

    gap:12px;

    width:100%;

    padding:10px 12px;

    border:none;

    border-radius:8px;

    background:transparent;

    color:var(--text-color);

    text-align:left;

    cursor:pointer;

}


.context-item:hover {
    background:var(--btn-hover);
}


.context-item.delete {
    color:#ef4444;
}


.context-item i {
    width:18px;
}


/* ============================================================
   MAIN
============================================================ */

.main-chat {

    flex:1;

    width:100%;

    height:100vh;

    height:100dvh;

    display:flex;

    flex-direction:column;

    overflow:hidden;

}


.chat-header {

    padding:15px 25px;

    border-bottom:
        1px solid var(--border-color);

    display:flex;

    align-items:center;

    justify-content:space-between;

    flex-shrink:0;

}


.header-left {

    display:flex;

    align-items:center;

}


.toggle-btn,
.theme-btn {

    background:transparent;

    border:none;

    color:var(--text-color);

    cursor:pointer;

    padding:7px 12px;

    border-radius:20px;

}


.toggle-btn:hover,
.theme-btn:hover {
    background:var(--btn-hover);
}


.theme-btn {

    border:
        1px solid var(--border-color);

}


/* ============================================================
   CHAT
============================================================ */

.chat-container {

    flex:1;

    overflow-y:auto;

    padding:20px;

    width:100%;

    max-width:900px;

    margin:0 auto;

}


.welcome-screen {

    min-height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

}


.welcome-avatar {

    width:58px;

    height:58px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-weight:bold;

    font-size:22px;

    margin-bottom:15px;

}


.message {

    display:flex;

    gap:15px;

    margin-bottom:28px;

}


.avatar {

    width:35px;

    height:35px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-shrink:0;

    font-size:13px;

    font-weight:bold;

}


.user-avatar {

    background:#5436da;

    color:white;

}


.ai-avatar {

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    color:white;

}


.bubble {

    width:100%;

    max-width:88%;

    color:var(--bubble-text);

    font-size:16px;

    line-height:1.6;

    word-wrap:break-word;

}


.bubble strong {
    color:var(--strong-color);
}


.bubble table {

    width:100%;

    border-collapse:collapse;

    margin:12px 0;

}


.bubble th,
.bubble td {

    border:
        1px solid var(--border-color);

    padding:8px;

}


.bubble th {
    background:var(--btn-hover);
}


/* ============================================================
   IMAGE
============================================================ */

.uploaded-img-preview {

    display:block;

    max-width:350px;

    max-height:500px;

    width:auto;

    height:auto;

    object-fit:contain;

    border-radius:12px;

        1px solid var(--border-color);

}


.pdf-badge {

    display:inline-flex;

    align-items:center;

    gap:8px;

    background:var(--btn-hover);

    border:

    color:#ff4d4d;

}


/* ============================================================
   CODE
============================================================ */

    border-radius:8px;

    overflow:hidden;

    border:

}


.code-header {

    background:#21252b;

}

    padding:3px 8px;

}


/* ============================================================

============================================================ */

.input-container-box {

    background:var(--bg-color);

    flex-shrink:0;

}


.input-wrapper {

    max-width:850px;

    margin:0 auto;

    background:var(--input-bg);

    border:
        1px solid var(--input-border);

}


#filePreviewArea {

    display:none;

    position:relative;

    width:fit-content;

    margin-bottom:8px;

}


#previewImgThumb {

    height:70px;

    border-radius:12px;

}


#pdfPreviewThumb {

    background:var(--btn-hover);

    border:
        1px solid #e11d48;

    padding:8px 12px;

    border-radius:10px;

    font-size:13px;

}


.close-img-btn {

    position:absolute;

    top:-7px;

    right:-7px;

    width:22px;

    height:22px;

    border:none;

    border-radius:50%;

    background:#e11d48;

    color:white;

    cursor:pointer;

}


.input-row {

    display:flex;

    align-items:center;

    gap:10px;

}


.plus-btn,
.mic-btn {

    background:none;

    border:none;

    color:var(--accent-color);

    font-size:18px;

    cursor:pointer;

    padding:5px;

}


.mic-btn.recording {

    color:#ef4444 !important;

    animation:pulse 1.2s infinite;

}


@keyframes pulse {

    0% {
        transform:scale(1);
    }

    50% {
        transform:scale(1.2);
    }

    100% {
        transform:scale(1);
    }

}


.chat-textarea {

    background:transparent;

    border:none;

    outline:none;

    color:var(--text-color);

    width:100%;

    resize:none;

    min-height:28px;

    max-height:120px;

    padding:6px 0;

    font-family:inherit;

}


.send-btn {

    width:32px;

    border-radius:50%;

    border:none;

    background:var(--text-color);

    color:var(--bg-color);

    align-items:center;

    justify-content:center;

    cursor:pointer;

    flex-shrink:0;

}


.send-btn:disabled {

    color:var(--text-muted);

}


.tts-btn {

    background:none;

    color:var(--text-muted);

}


/* ============================================================
   MODAL
============================================================ */

.modal-content {

    background:var(--modal-bg);

    color:var(--text-color);

}


.modal-btn {

}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:768px) {

    }


    .chat-container {

    }

    }


    .bubble {
        max-width:100%;
    }


    .uploaded-img-preview {
        max-width:280px;
    }

}

</style>

<script>

/* ============================================================
   VARIABLES
============================================================ */

let selectedFile = null;

let selectedFileDataURL = null;

let contextSessionId = null;

let longPressTimer = null;


const questionInput =
    document.getElementById("question");


const chatBox =
    document.getElementById("chatBox");


const historyList =
    document.getElementById("historyList");


const micBtn =
    document.getElementById("micBtn");


/* ============================================================
   INDEXEDDB STORAGE
============================================================ */

const DB_NAME = "TutoAI_DB";

const DB_VERSION = 1;

const STORE_NAME = "sessions";

let db = null;

let allSessions = {};

let currentSessionId =
    localStorage.getItem(
        "tuto_current_session_id"
    ) || null;


/* ============================================================
   OPEN DATABASE
============================================================ */

function openDatabase(){

    return new Promise(
        function(resolve, reject){

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function(event){

                    const database =
                        event.target.result;


                    if(
                        !database.objectStoreNames
                            .contains(STORE_NAME)
                    ){

                        database.createObjectStore(
                            STORE_NAME,
                            {
                                keyPath:"id"
                            }
                        );

                    }

                };


            request.onsuccess =
                function(event){

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* ============================================================
   LOAD ALL SESSIONS
============================================================ */

function loadAllSessions(){

    return new Promise(
        function(resolve, reject){

            if(!db){

                resolve({});

                return;

            }


            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.getAll();


            request.onsuccess =
                function(){

                    const sessions = {};


                    (
                        request.result || []
                    ).forEach(
                        function(session){

                            sessions[
                                session.id
                            ] =
                                session;

                        }
                    );


                    resolve(
                        sessions
                    );

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* ============================================================
   SAVE ONE SESSION
============================================================ */

function saveSession(session){

    return new Promise(
        function(resolve, reject){

            if(
                !db ||
                !session ||
                !session.id
            ){

                resolve();

                return;

            }


            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.put(session);


            request.onsuccess =
                function(){

                    resolve();

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* ============================================================
   DELETE ONE SESSION
============================================================ */

function deleteSessionFromDB(id){

    return new Promise(
        function(resolve, reject){

            if(!db){

                resolve();

                return;

            }


            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.delete(id);


            request.onsuccess =
                function(){

                    resolve();

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* ============================================================
   SAVE CURRENT SESSION
============================================================ */

async function saveSessions(){

    try{

        if(currentSessionId){

            localStorage.setItem(
                "tuto_current_session_id",
                currentSessionId
            );

        }


        if(
            currentSessionId &&
            allSessions[currentSessionId]
        ){

            allSessions[
                currentSessionId
            ].updatedAt =
                Date.now();


            await saveSession(
                allSessions[
                    currentSessionId
                ]
            );

        }

    }catch(error){

        console.error(
            "IndexedDB storage error:",
            error
        );

        /*
         * Important:
         * No "Chat storage is full" popup.
         */

        console.warn(
            "Unable to save chat."
        );

    }

}

/* ============================================================

============================================================ */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );


    div.innerText =
        text || "";


    return div.innerHTML;

}


/* ============================================================
   MATH
============================================================ */

function renderMath(element){

    if(
        window.renderMathInElement
    ){

        try{

            renderMathInElement(
                element,
                {

                    delimiters:[

                        {
                            left:"$$",
                            right:"$$",
                            display:true
                        },

                        {
                            left:"$",
                            right:"$",
                            display:false
                        },

                        {
                            left:"\\(",
                            right:"\\)",
                            display:false
                        },

                        {
                            left:"\\[",
                            right:"\\]",
                            display:true
                        }

                    ],

                    throwOnError:false

                }
            );

        }catch(e){}

    }

}


/* ============================================================
   CODE BLOCKS
============================================================ */

function processCodeBlocks(element){

    if(!element)
        return;


    element
        .querySelectorAll("pre")
        .forEach(
            function(pre){

                if(
                    pre.closest(
                        ".code-container"
                    )
                )
                    return;


                const code =
                    pre.querySelector(
                        "code"
                    );


                const codeText =
                    code
                    ? code.innerText
                    : pre.innerText;


                let language =
                    "code";


                if(
                    code &&
                    code.className
                ){

                    const match =
                        code.className.match(
                            /language-(\w+)/
                        );


                    if(match)
                        language =
                            match[1];

                }


                const container =
                    document.createElement(
                        "div"
                    );


                container.className =
                    "code-container";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "code-header";


                const label =
                    document.createElement(
                        "span"
                    );


                label.innerText =
                    language;


                const copyBtn =
                    document.createElement(
                        "button"
                    );


                copyBtn.className =
                    "copy-code-btn";


                copyBtn.innerHTML =
                    '<i class="fa-regular fa-copy"></i> Copy';


                copyBtn.onclick =
                    async function(){

                        try{

                            await navigator
                                .clipboard
                                .writeText(
                                    codeText.trim()
                                );


                            copyBtn.innerHTML =
                                '<i class="fa-solid fa-check"></i> Copied!';


                            setTimeout(
                                function(){

                                    copyBtn.innerHTML =
                                        '<i class="fa-regular fa-copy"></i> Copy';

                                },
                                2000
                            );

                        }catch(e){}

                    };


                header.appendChild(
                    label
                );


                header.appendChild(
                    copyBtn
                );


                pre.parentNode.insertBefore(
                    container,
                    pre
                );


                container.appendChild(
                    header
                );


                container.appendChild(
                    pre
                );


                if(
                    window.hljs &&
                    code
                ){

                    try{

                        hljs.highlightElement(
                            code
                        );

                    }catch(e){}

                }

            }
        );

}


/* ============================================================
   NEW CHAT
============================================================ */

function startNewChat(
    render = true
){

    currentSessionId =
        "session_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9);


    allSessions[
        currentSessionId
    ] = {

        id:
            currentSessionId,

        title:
            "New Chat",

        html:
            DEFAULT_WELCOME,

        isPinned:
            false,

        createdAt:
            Date.now(),

        updatedAt:
            Date.now()

    };


    /*
     * Save only this new chat
     */

    saveSessions();


    if(render){

        renderSidebarHistory();

        loadSession(
            currentSessionId
        );

    }


    mobileSidebarCheck();

}


/* ============================================================
   LOAD SESSION
============================================================ */

function loadSession(id){

    if(
        !allSessions[id]
    )
        return;


    currentSessionId =
        id;


    localStorage.setItem(
        "tuto_current_session_id",
        currentSessionId
    );


    chatBox.innerHTML =
        allSessions[id].html ||
        DEFAULT_WELCOME;


    chatBox
        .querySelectorAll(
            ".bubble"
        )
        .forEach(
            function(bubble){

                renderMath(
                    bubble
                );


                processCodeBlocks(
                    bubble
                );

            }
        );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    renderSidebarHistory();

    mobileSidebarCheck();

}


/* ============================================================
   DELETE
============================================================ */

async function deleteSession(
    event,
    id
){

    if(event)
        event.stopPropagation();


    if(
        !allSessions[id]
    )
        return;


    if(
        !confirm(
            "Delete this chat?"
        )
    )
        return;


    delete allSessions[id];


    await deleteSessionFromDB(id);


    const keys =
        Object.keys(
            allSessions
        );


    if(
        currentSessionId === id
    ){

        if(keys.length){

            currentSessionId =
                keys[keys.length - 1];

        }else{

            startNewChat(false);

        }

    }


    if(currentSessionId){

        localStorage.setItem(
            "tuto_current_session_id",
            currentSessionId
        );

    }


    renderSidebarHistory();


    loadSession(
        currentSessionId
    );

}


/* ============================================================
   PIN
============================================================ */

function togglePin(
    event,
    id
){

    if(event)
        event.stopPropagation();


    if(
        allSessions[id]
    ){

        allSessions[id].isPinned =
            !allSessions[id].isPinned;


        saveSession(
            allSessions[id]
        );


        renderSidebarHistory();

    }

}


/* ============================================================
   RENAME
============================================================ */

function renameSession(id){

    if(
        !allSessions[id]
    )
        return;


    const oldTitle =
        allSessions[id].title ||
        "New Chat";


    const newTitle =
        prompt(
            "Rename chat:",
            oldTitle
        );


    if(
        newTitle === null
    )
        return;


    const cleanTitle =
        newTitle.trim();


    if(
        !cleanTitle
    )
        return;


    allSessions[id].title =
        cleanTitle.substring(
            0,
            80
        );


    saveSession(
        allSessions[id]
    );


    renderSidebarHistory();

}


/* ============================================================
   SIDEBAR HISTORY
============================================================ */

function renderSidebarHistory(){

    historyList.innerHTML = "";


    const keys =
        Object.keys(
            allSessions
        ).sort(
            function(a,b){

                return (
                    (
                        allSessions[b]
                            .updatedAt || 0
                    )
                    -
                    (
                        allSessions[a]
                            .updatedAt || 0
                    )
                );

            }
        );


    const pinned =
        keys.filter(
            function(id){

                return allSessions[
                    id
                ].isPinned;

            }
        );


    const recent =
        keys.filter(
            function(id){

                return !allSessions[
                    id
                ].isPinned;

            }
        );


    if(pinned.length){

        historyList.innerHTML += `

            <div class="history-label">
                PINNED
            </div>

        `;


        pinned.forEach(
            function(id){

                renderHistoryItem(
                    id
                );

            }
        );

    }


    if(recent.length){

        historyList.innerHTML += `

            <div class="history-label">
                RECENT CHATS
            </div>

        `;


        recent.forEach(
            function(id){

                renderHistoryItem(
                    id
                );

            }
        );

    }

}


/* ============================================================
   HISTORY ITEM
============================================================ */

function renderHistoryItem(id){

    const session =
        allSessions[id];


    const active =
        id === currentSessionId
        ? "active"
        : "";


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item " +
        active;


    item.dataset.id =
        id;


    item.innerHTML = `

        <div class="history-title">

            <i
                class="fa-regular fa-message me-2">
            </i>

            ${escapeHTML(
                session.title ||
                "New Chat"
            )}

            ${
                session.isPinned
                ?
                '<i class="fa-solid fa-thumbtack pinned-icon"></i>'
                :
                ''
            }

        </div>

    `;


    item.addEventListener(
        "click",
        function(){

            loadSession(id);

        }
    );


    item.addEventListener(
        "contextmenu",
        function(e){

            e.preventDefault();


            showContextMenu(
                e.clientX,
                e.clientY,
                id
            );

        }
    );


    item.addEventListener(
        "touchstart",
        function(e){

            const touch =
                e.touches[0];


            longPressTimer =
                setTimeout(
                    function(){

                        showContextMenu(
                            touch.clientX,
                            touch.clientY,
                            id
                        );

                    },
                    600
                );

        },
        {
            passive:true
        }
    );


    item.addEventListener(
        "touchend",
        function(){

            clearTimeout(
                longPressTimer
            );

        }
    );


    item.addEventListener(
        "touchmove",
        function(){

            clearTimeout(
                longPressTimer
            );

        }
    );


    historyList.appendChild(
        item
    );

}

/* ============================================================
   FILE TO DATA URL
============================================================ */

function fileToDataURL(file){

    return new Promise(
        function(resolve, reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

/* ============================================================
   VOICE
============================================================ */

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


async function toggleVoiceRecording(){

    if(isRecording){

        stopRecording();

    }else{

        startRecording();

    }

}


async function startRecording(){

    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        audioChunks = [];


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );


                stream
                    .getTracks()
                    .forEach(
                        function(track){

                            track.stop();

                        }
                    );


                await transcribeAudio(
                    blob
                );

            };


        mediaRecorder.start();


        isRecording =
            true;


        micBtn.classList.add(
            "recording"
        );


        questionInput.placeholder =
            "Recording... Tap microphone to stop";

    }catch(error){

        alert(
            "Microphone permission denied or unavailable."
        );

    }

}


function stopRecording(){

    if(
        mediaRecorder &&
        isRecording
    ){

        mediaRecorder.stop();


        isRecording =
            false;


        micBtn.classList.remove(
            "recording"
        );


        questionInput.placeholder =
            "Processing voice...";

    }

}


async function transcribeAudio(
    blob
){

    const formData =
        new FormData();


    formData.append(
        "audio",
        blob,
        "audio.webm"
    );


    try{

        const response =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            data.status ===
                "success"
            &&
            data.text
        ){

            questionInput.value =
                data.text;


            questionInput.style.height =
                "auto";


            questionInput.style.height =
                Math.min(
                    questionInput.scrollHeight,
                    120
                ) + "px";

        }else{

            alert(
                data.message ||
                "Voice recognition failed."
            );

        }

    }catch(error){

        alert(
            "Could not connect to voice service."
        );

    }finally{

        questionInput.placeholder =
            "Message Tuto AI...";

    }

}


/* ============================================================
   TEXT TO SPEECH
============================================================ */

function speakText(button){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Voice output is not supported."
        );

        return;

    }


    const bubble =
        button.closest(
            ".bubble"
        );


    const text =
        bubble
        ? bubble.innerText
        : "";


    if(
        window.speechSynthesis.speaking
    ){

        window.speechSynthesis.cancel();


        button.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';


        return;

    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if(
        /[\u0980-\u09FF]/.test(
            text
        )
    ){

        utterance.lang =
            "bn-BD";

    }else{

        utterance.lang =
            "en-US";

    }


    button.innerHTML =
        '<i class="fa-solid fa-volume-xmark text-warning"></i>';


    utterance.onend =
        function(){

            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

        };


    window.speechSynthesis.speak(
        utterance
    );

}

                    id="${loadingId}">

                    <div class="avatar ai-avatar">
                        AI
                    </div>

                    <div
                        class="bubble text-secondary">

                        <i
                            class="fa-solid fa-circle-notch fa-spin me-2">
                        </i>

                        Thinking...

                    </div>

                </div>

            `;


            chatBox.scrollTop =
                chatBox.scrollHeight;


            try{

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method:"POST",
                            body:formData
                        }
                    );


                const data =
                    await response.json();


                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(
                    data.status ===
                    "success"
                ){

                    let content =
                        data.response ||
                        "";


                    try{

                        content =
                            marked.parse(
                                content
                            );

                    }catch(error){

                        content =
                            escapeHTML(
                                data.response
                            ).replace(
                                /\n/g,
                                "<br>"
                            );

                    }


                    if(!loading){

                        return;

                    }


                    const bubble =
                        loading.querySelector(
                            ".bubble"
                        );


                    bubble.innerHTML = `

                        <div
                            class="d-flex
                            justify-content-between
                            align-items-center
                            mb-1">

                            <strong>
                                Tuto AI
                            </strong>

                            <button
                                class="tts-btn"
                                onclick="speakText(this)"
                                title="Read Aloud">

                                <i
                                    class="fa-solid fa-volume-high">
                                </i>

                            </button>

                        </div>


                        <div>
                            ${content}
                        </div>

                    `;


                    processCodeBlocks(
                        bubble
                    );


                    renderMath(
                        bubble
                    );


                    /*
                     * Save entire current chat
                     * into IndexedDB.
                     */

                    if(
                        allSessions[
                            currentSessionId
                        ]
                    ){

                        allSessions[
                            currentSessionId
                        ].html =
                            chatBox.innerHTML;


                        allSessions[
                            currentSessionId
                        ].updatedAt =
                            Date.now();


                        await saveSession(
                            allSessions[
                                currentSessionId
                            ]
                        );

                    }


                    /*
                     * Generate title
                     */

                    if(
                        allSessions[
                            currentSessionId
                        ] &&
                        allSessions[
                            currentSessionId
                        ].title ===
                        "New Chat"
                    ){

                        generateTitle(
                            question ||
                            "Image conversation"
                        );

                    }


                }else{

                    if(loading){

                        loading.querySelector(
                            ".bubble"
                        ).innerHTML = `

                            <span class="text-danger">

                                Error:
                                ${escapeHTML(
                                    data.message ||
                                    "Something went wrong."
                                )}

                            </span>

                        `;

                    }

                }


            }catch(error){

                console.error(
                    "Chat error:",
                    error
                );


                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(loading){

                    loading.querySelector(
                        ".bubble"
                    ).innerHTML = `

                        <span class="text-danger">

                            Server connection error.

                        </span>

                    `;

                }

            }finally{

                sendBtn.disabled =
                    false;


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }

        }
    );


/* ============================================================
   TITLE GENERATION
============================================================ */

async function generateTitle(
    prompt
){

    try{

        const formData =
            new FormData();


        formData.append(
            "prompt",
            prompt
        );


        const response =
            await fetch(
                "/api/generate-title",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            data.status ===
                "success"
            &&
            data.title
            &&
            allSessions[
                currentSessionId
            ]
        ){

            allSessions[
                currentSessionId
            ].title =
                data.title;


            allSessions[
                currentSessionId
            ].updatedAt =
                Date.now();


            await saveSession(
                allSessions[
                    currentSessionId
                ]
            );


            renderSidebarHistory();

        }

    }catch(error){

        console.error(
            "Title generation error:",
            error
        );

    }

}


/* ============================================================
   CLOSE MENU ON ESC
============================================================ */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            hideContextMenu();

        }

    }
);

</script>
