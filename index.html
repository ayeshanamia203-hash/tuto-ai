<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">
<title>Tuto AI</title>
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js">
</script>
<script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js">
</script>
<script
    src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js">
</script>
<style>
/* ============================================================
   THEME
============================================================ */
:root[data-theme="dark"] {
    --bg-color:#131314;
    --sidebar-bg:#1e1e20;
    --text-color:#ffffff;
    --text-muted:#b8b8b8;
    --accent-color:#a8c7fa;
    --border-color:#2d2d30;
    --input-bg:#1e1e20;
    --input-border:#3c4043;
    --btn-hover:#2b2a33;
    --bubble-text:#ffffff;
    --strong-color:#a8c7fa;
    --modal-bg:#1e1e20;
    --menu-bg:#29292c;
}
:root[data-theme="light"] {
    --bg-color:#ffffff;
    --sidebar-bg:#f0f4f9;
    --text-color:#1f1f1f;
    --text-muted:#555555;
    --accent-color:#0b57d0;
    --border-color:#e1e3e1;
    --input-bg:#f0f4f9;
    --input-border:#c4c7c5;
    --btn-hover:#e3e3e3;
    --bubble-text:#1f1f1f;
    --strong-color:#0b57d0;
    --modal-bg:#ffffff;
    --menu-bg:#ffffff;
}
* {
    box-sizing:border-box;
}
html,
body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg-color);
    color:var(--text-color);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}
body {
    display:flex;
}
/* ============================================================
   SIDEBAR
============================================================ */
.sidebar {
    width:260px;
    height:100%;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border-color);
    padding:20px;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    transition:all .25s ease;
    z-index:1000;
}
.sidebar.collapsed {
    margin-left:-260px;
}
.sidebar-overlay {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:999;
}
.new-chat-btn {
    background:var(--input-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
    border-radius:30px;
    padding:10px 15px;
    font-weight:500;
}
.history-list {
    flex:1;
    overflow-y:auto;
    margin-top:15px;
}
.history-label {
    color:var(--text-muted);
    font-size:11px;
    font-weight:700;
    margin:15px 8px 8px;
}
.history-item {
    display:flex;
    align-items:center;
    padding:11px 12px;
    border-radius:10px;
    color:var(--text-muted);
    cursor:pointer;
    font-size:14px;
    margin-bottom:5px;
    user-select:none;
    position:relative;
}
.history-item:hover,
.history-item.active {
    background:var(--btn-hover);
    color:var(--text-color);
}
.history-title {
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
}
.pinned-icon {
    color:#f59e0b;
    margin-left:5px;
}
/* ============================================================
   CONTEXT MENU
============================================================ */
.chat-context-menu {
    display:none;
    position:fixed;
    min-width:190px;
    background:var(--menu-bg);
    border:1px solid var(--border-color);
    border-radius:13px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    padding:7px;
    z-index:5000;
}
.chat-context-menu.show {
    display:block;
}
.context-item {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:8px;
    background:transparent;
    color:var(--text-color);
    text-align:left;
    cursor:pointer;
}
.context-item:hover {
    background:var(--btn-hover);
}
.context-item.delete {
    color:#ef4444;
}
.context-item i {
    width:18px;
}
/* ============================================================
   MAIN
============================================================ */
.main-chat {
    flex:1;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.chat-header {
    padding:15px 25px;
    border-bottom:1px solid var(--border-color);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
}
.header-left {
    display:flex;
    align-items:center;
}
.toggle-btn,
.theme-btn {
    background:transparent;
    border:none;
    color:var(--text-color);
    cursor:pointer;
    padding:7px 12px;
    border-radius:20px;
}
.toggle-btn:hover,
.theme-btn:hover {
    background:var(--btn-hover);
}
.theme-btn {
    border:1px solid var(--border-color);
}
/* ============================================================
   CHAT
============================================================ */
.chat-container {
    flex:1;
    overflow-y:auto;
    padding:20px;
    width:100%;
    max-width:900px;
    margin:0 auto;
}
.welcome-screen {
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}
.welcome-avatar {
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:22px;
    margin-bottom:15px;
}
.message {
    display:flex;
    gap:15px;
    margin-bottom:28px;
}
.avatar {
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
    font-size:13px;
    font-weight:bold;
}
.user-avatar {
    background:#5436da;
    color:white;
}
.ai-avatar {
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;
}
.bubble {
    width:100%;
    max-width:88%;
    color:var(--bubble-text);
    font-size:16px;
    line-height:1.6;
    word-wrap:break-word;
}
.bubble strong {
    color:var(--strong-color);
}
.bubble table {
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
}
.bubble th,
.bubble td {
    border:1px solid var(--border-color);
    padding:8px;
}
.bubble th {
    background:var(--btn-hover);
}
/* ============================================================
   IMAGE / PDF
============================================================ */
.uploaded-img-preview {
    display:block;
    max-width:350px;
    max-height:500px;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    border:1px solid var(--border-color);
    margin-bottom:10px;
}
.pdf-badge {
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--btn-hover);
    border:1px solid #e11d48;
    color:#ff4d4d;
    padding:7px 12px;
    border-radius:8px;
}
/* ============================================================
   CODE
============================================================ */
.code-container {
    margin:12px 0;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #3e4451;
    background:#282c34;
}
.code-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#21252b;
    padding:6px 12px;
    font-size:12px;
    color:#abb2bf;
}
pre {
    margin:0 !important;
    padding:12px !important;
    overflow-x:auto;
}
.copy-code-btn {
    background:#3e4451;
    color:white;
    border:none;
    border-radius:4px;
    padding:3px 8px;
    font-size:12px;
    cursor:pointer;
}
/* ============================================================
   INPUT
============================================================ */
.input-container-box {
    width:100%;
    padding:10px 15px 15px;
    background:var(--bg-color);
    flex-shrink:0;
}
.input-wrapper {
    width:100%;
    max-width:850px;
    margin:0 auto;
    background:var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:24px;
    padding:8px 15px;
}
#filePreviewArea {
    display:none;
    position:relative;
    width:fit-content;
    margin-bottom:8px;
}
#previewImgThumb {
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:12px;
}
#pdfPreviewThumb {
    display:none;
    background:var(--btn-hover);
    border:1px solid #e11d48;
    color:#ff4d4d;
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
}
.close-img-btn {
    position:absolute;
    top:-7px;
    right:-7px;
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:#e11d48;
    color:white;
    cursor:pointer;
}
.input-row {
    display:flex;
    align-items:center;
    gap:10px;
}
.plus-btn,
.mic-btn {
    background:none;
    border:none;
    color:var(--accent-color);
    font-size:18px;
    cursor:pointer;
    padding:5px;
}
.mic-btn.recording {
    color:#ef4444 !important;
    animation:pulse 1.2s infinite;
}
@keyframes pulse {
    0% {
        transform:scale(1);
    }
    50% {
        transform:scale(1.2);
    }
    100% {
        transform:scale(1);
    }
}
.chat-textarea {
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-color);
    width:100%;
    resize:none;
    min-height:28px;
    max-height:120px;
    padding:6px 0;
    font-size:15px;
    font-family:inherit;
}
.chat-textarea::placeholder {
    color:var(--text-muted);
}
/* ============================================================
   SEND / VOICE BUTTON
============================================================ */
.send-btn {
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}
.send-btn.voice-mode {
    background:#1683ff;
    color:#ffffff;
}
.send-btn.send-mode {
    background:var(--text-color);
    color:var(--bg-color);
}
.send-btn:hover {
    transform:scale(1.05);
}
.send-btn.voice-mode:hover {
    box-shadow:0 0 0 4px rgba(22,131,255,.15);
}
.send-btn.voice-mode.listening {
    animation:voiceButtonPulse 1.2s infinite;
}
@keyframes voiceButtonPulse {
    0% {
        box-shadow:0 0 0 0 rgba(22,131,255,.55);
    }
    70% {
        box-shadow:0 0 0 12px rgba(22,131,255,0);
    }
    100% {
        box-shadow:0 0 0 0 rgba(22,131,255,0);
    }
}
.tts-btn {
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
}
/* ============================================================
   VOICE ASSISTANT
============================================================ */
.voice-assistant-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10000;
    padding:20px;
}
.voice-assistant-overlay.show {
    display:flex;
}
.voice-assistant-panel {
    width:min(440px,100%);
    min-height:540px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--modal-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
    border-radius:28px;
    padding:25px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}
.voice-assistant-top {
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.voice-assistant-title {
    font-size:18px;
    font-weight:700;
}
.voice-close-btn {
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:var(--btn-hover);
    color:var(--text-color);
    cursor:pointer;
}
.voice-orb {
    width:150px;
    height:150px;
    border-radius:50%;
    background:linear-gradient(135deg,#1683ff,#635bff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:45px;
    margin-top:65px;
    box-shadow:0 15px 45px rgba(22,131,255,.30);
}
.voice-orb.active {
    animation:voiceOrbPulse 1.3s infinite;
}
@keyframes voiceOrbPulse {
    0% {
        transform:scale(1);
    }
    50% {
        transform:scale(1.08);
    }
    100% {
        transform:scale(1);
    }
}
.voice-status {
    margin-top:24px;
    text-align:center;
    color:var(--text-muted);
    font-size:15px;
}
.voice-transcript {
    width:100%;
    min-height:90px;
    max-height:170px;
    overflow-y:auto;
    margin-top:20px;
    padding:14px;
    border-radius:15px;
    background:var(--input-bg);
    border:1px solid var(--border-color);
    color:var(--text-color);
    font-size:15px;
    line-height:1.5;
    text-align:left;
}
.voice-main-btn {
    width:72px;
    height:72px;
    border-radius:50%;
    border:none;
    background:#1683ff;
    color:white;
    font-size:25px;
    cursor:pointer;
    margin-top:22px;
    transition:transform .2s ease;
}
.voice-main-btn:hover {
    transform:scale(1.05);
}
.voice-main-btn.recording {
    background:#ef4444;
    animation:pulse 1.2s infinite;
}
/* ============================================================
   MODAL
============================================================ */
.modal-content {
    background:var(--modal-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
}
.modal-btn {
    width:100%;
    padding:15px;
    margin-bottom:10px;
    border-radius:15px;
    border:1px solid var(--border-color);
    background:var(--input-bg);
    color:var(--text-color);
    text-align:left;
}
.modal-btn:hover {
    background:var(--btn-hover);
}
/* ============================================================
   MOBILE
============================================================ */
@media(max-width:768px) {
    .sidebar {
        position:absolute;
        top:0;
        bottom:0;
        left:0;
        box-shadow:5px 0 15px rgba(0,0,0,.3);
    }
    .sidebar.collapsed {
        margin-left:-260px;
    }
    .sidebar-overlay.active {
        display:block;
    }
    .chat-container {
        padding:15px 10px;
    }
    .chat-header {
        padding:12px 15px;
    }
    .bubble {
        max-width:100%;
    }
    .uploaded-img-preview {
        max-width:280px;
    }
    .voice-assistant-panel {
        min-height:500px;
        padding:22px 18px;
    }
    .voice-orb {
        width:125px;
        height:125px;
        margin-top:45px;
    }
}
</style>
</head>
<body>
<!-- ============================================================
     SIDEBAR OVERLAY
============================================================ -->
<div
    class="sidebar-overlay"
    id="sidebarOverlay"
    onclick="toggleSidebar()">
</div>
<!-- ============================================================
     SIDEBAR
============================================================ -->
<div
    class="sidebar"
    id="sidebar">
    <div
        class="d-flex justify-content-between align-items-center mb-3 d-md-none">
        <span class="fw-bold">
            Menu
        </span>
        <button
            class="btn btn-sm text-secondary"
            onclick="toggleSidebar()">
            <i class="fa-solid fa-xmark fa-xl"></i>
        </button>
    </div>
    <button
        class="new-chat-btn w-100 mb-2"
        onclick="startNewChat()">
        <i class="fa-solid fa-plus me-2"></i>
        New Chat
    </button>
    <div
        class="history-list"
        id="historyList">
    </div>
</div>
<!-- ============================================================
     MAIN
============================================================ -->
<div class="main-chat">
    <div class="chat-header">
        <div class="header-left">
            <button
                class="toggle-btn"
                onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h5 class="m-0 fw-bold">
                <i class="fa-solid fa-sparkles me-2 text-warning"></i>
                Tuto AI
            </h5>
        </div>
        <button
            class="theme-btn"
            onclick="toggleTheme()"
            id="themeToggleBtn">
            <i
                class="fa-solid fa-sun"
                id="themeIcon">
            </i>
            <span id="themeText">
                Light
            </span>
        </button>
    </div>
    <!-- ========================================================
         CHAT
    ======================================================== -->
    <div
        class="chat-container"
        id="chatBox">
    </div>
    <!-- ========================================================
         INPUT
    ======================================================== -->
    <div class="input-container-box">
        <div class="input-wrapper">
            <div id="filePreviewArea">
                <img
                    id="previewImgThumb"
                    src=""
                    alt="Image preview"
                    style="display:none;">
                <div id="pdfPreviewThumb">
                    <i class="fa-solid fa-file-pdf me-2"></i>
                    <span id="pdfFileName">
                        document.pdf
                    </span>
                </div>
                <button
                    class="close-img-btn"
                    onclick="clearSelectedFile()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="input-row">
                <!-- PLUS -->
                <button
                    class="plus-btn"
                    data-bs-toggle="modal"
                    data-bs-target="#uploadModal">
                    <i class="fa-solid fa-circle-plus"></i>
                </button>
                <form
                    id="chatForm"
                    class="d-flex w-100 align-items-center gap-2">
                    <!-- TEXT INPUT -->
                    <textarea
                        id="question"
                        class="chat-textarea"
                        rows="1"
                        placeholder="Ask anything">
                    </textarea>
                    <!-- EXISTING MIC — UNCHANGED -->
                    <button
                        type="button"
                        class="mic-btn"
                        id="micBtn"
                        onclick="toggleVoiceRecording()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <!-- VOICE / SEND BUTTON -->
                    <button
                        type="button"
                        class="send-btn voice-mode"
                        id="sendBtn"
                        onclick="handleSendOrVoice()"
                        title="Open Voice Assistant">
                        <i
                            class="fa-solid fa-waveform-lines"
                            id="sendBtnIcon">
                        </i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- ============================================================
     CONTEXT MENU
============================================================ -->
<div
    class="chat-context-menu"
    id="chatContextMenu">
    <button
        class="context-item"
        onclick="contextPin()">
        <i class="fa-solid fa-thumbtack"></i>
        <span id="contextPinText">
            Pin
        </span>
    </button>
    <button
        class="context-item"
        onclick="contextRename()">
        <i class="fa-solid fa-pen"></i>
        Rename
    </button>
    <button
        class="context-item delete"
        onclick="contextDelete()">
        <i class="fa-solid fa-trash"></i>
        Delete
    </button>
</div>
<!-- ============================================================
     FILE INPUTS
============================================================ -->
<input
    type="file"
    id="galleryInput"
    accept="image/*"
    style="display:none"
    onchange="handleFileSelect(this)">
<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    style="display:none"
    onchange="handleFileSelect(this)">
<input
    type="file"
    id="pdfInput"
    accept="application/pdf"
    style="display:none"
    onchange="handleFileSelect(this)">
<!-- ============================================================
     UPLOAD MODAL
============================================================ -->
<div
    class="modal fade"
    id="uploadModal"
    tabindex="-1">
    <div
        class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">
                    <i class="fa-solid fa-paperclip me-2 text-primary"></i>
                    Attach File
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>
            <div class="modal-body">
                <button
                    class="modal-btn"
                    onclick="triggerCamera()">
                    <i class="fa-solid fa-camera fa-lg me-3 text-warning"></i>
                    <strong>
                        Take Photo
                    </strong>
                </button>
                <button
                    class="modal-btn"
                    onclick="triggerGallery()">
                    <i class="fa-solid fa-images fa-lg me-3 text-info"></i>
                    <strong>
                        Upload Photo
                    </strong>
                </button>
                <button
                    class="modal-btn"
                    onclick="triggerPDF()">
                    <i class="fa-solid fa-file-pdf fa-lg me-3 text-danger"></i>
                    <strong>
                        Upload PDF Document
                    </strong>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- ============================================================
     TUTO AI VOICE ASSISTANT
============================================================ -->
<div
    class="voice-assistant-overlay"
    id="voiceAssistantOverlay">
    <div class="voice-assistant-panel">
        <div class="voice-assistant-top">
            <div class="voice-assistant-title">

<script>
/* ============================================================
   VARIABLES
============================================================ */
let selectedFile = null;
let selectedFileDataURL = null;
let contextSessionId = null;
let longPressTimer = null;
const questionInput =
    document.getElementById("question");
const chatBox =
    document.getElementById("chatBox");
const historyList =
    document.getElementById("historyList");
const micBtn =
    document.getElementById("micBtn");
/* ============================================================
   DATABASE
============================================================ */
const DB_NAME = "TutoAI_DB";
const DB_VERSION = 1;
const STORE_NAME = "sessions";
let db = null;
let allSessions = {};
let currentSessionId =
    localStorage.getItem(
        "tuto_current_session_id"
    ) || null;
/* ============================================================
   OPEN DATABASE
============================================================ */
function openDatabase(){
    return new Promise(
        function(resolve,reject){
            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );
            request.onupgradeneeded =
                function(event){
                    const database =
                        event.target.result;
                    if(
                        !database.objectStoreNames.contains(
                            STORE_NAME
                        )
                    ){
                        database.createObjectStore(
                            STORE_NAME,
                            {
                                keyPath:"id"
                            }
                        );
                    }
                };
            request.onsuccess =
                function(event){
                    db =
                        event.target.result;
                    resolve(db);
                };
            request.onerror =
                function(){
                    reject(request.error);
                };
        }
    );
}
/* ============================================================
   LOAD SESSIONS
============================================================ */
function loadAllSessions(){
    return new Promise(
        function(resolve,reject){
            if(!db){
                resolve({});
                return;
            }
            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );
            const store =
                transaction.objectStore(
                    STORE_NAME
                );
            const request =
                store.getAll();
            request.onsuccess =
                function(){
                    const sessions = {};
                    (
                        request.result || []
                    ).forEach(
                        function(session){
                            sessions[
                                session.id
                            ] = session;
                        }
                    );
                    resolve(sessions);
                };
            request.onerror =
                function(){
                    reject(request.error);
                };
        }
    );
}
/* ============================================================
   SAVE SESSION
============================================================ */
function saveSession(session){
    return new Promise(
        function(resolve,reject){
            if(
                !db ||
                !session ||
                !session.id
            ){
                resolve();
                return;
            }
            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );
            const store =
                transaction.objectStore(
                    STORE_NAME
                );
            const request =
                store.put(session);
            request.onsuccess =
                function(){
                    resolve();
                };
            request.onerror =
                function(){
                    reject(request.error);
                };
        }
    );
}
/* ============================================================
   DELETE SESSION
============================================================ */
function deleteSessionFromDB(id){
    return new Promise(
        function(resolve,reject){
            if(!db){
                resolve();
                return;
            }
            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );
            const store =
                transaction.objectStore(
                    STORE_NAME
                );
            const request =
                store.delete(id);
            request.onsuccess =
                function(){
                    resolve();
                };
            request.onerror =
                function(){
                    reject(request.error);
                };
        }
    );
}
/* ============================================================
   DEFAULT WELCOME
============================================================ */
const DEFAULT_WELCOME = `
<div
    class="welcome-screen"
    id="welcomeScreen">
    <div class="welcome-avatar">
        AI
    </div>
    <h2 class="fw-bold mb-2">

</div>
`;
/* ============================================================
   THEME
============================================================ */
function initTheme(){

}

/* ============================================================
   ESCAPE HTML
============================================================ */
function escapeHTML(text){
    const div =
        document.createElement("div");
    div.innerText =
        text || "";
    return div.innerHTML;
}
/* ============================================================
   MATH
============================================================ */
function renderMath(element){
    if(
        window.renderMathInElement
    ){
        try{
            renderMathInElement(
                element,
                {
                    delimiters:[
                        {
                            left:"$$",
                            right:"$$",
                            display:true
                        },
                        {
                            left:"$",
                            right:"$",
                            display:false
                        },
                        {
                            left:"\\(",
                            right:"\\)",
                            display:false
                        },
                        {
                            left:"\\[",
                            right:"\\]",
                            display:true
                        }
                    ],
                    throwOnError:false
                }
            );
        }catch(error){
            console.warn(
                "Math render error:",
                error
            );
        }
    }
}
/* ============================================================
   CODE BLOCKS
============================================================ */
function processCodeBlocks(element){
    if(!element)
        return;
    element
        .querySelectorAll("pre")
        .forEach(
            function(pre){
                if(
                    pre.closest(
                        ".code-container"
                    )
                ){
                    return;
                }
                const code =
                    pre.querySelector("code");
                const codeText =
                    code
                    ? code.innerText
                    : pre.innerText;
                let language =
                    "code";
                if(
                    code &&
                    code.className
                ){
                    const match =
                        code.className.match(
                            /language-(\w+)/
                        );
                    if(match){
                        language =
                            match[1];
                    }
                }
                const container =
                    document.createElement("div");
                container.className =
                    "code-container";
                const header =
                    document.createElement("div");
                header.className =
                    "code-header";
                const label =
                    document.createElement("span");
                label.innerText =
                    language;
                const copyBtn =
                    document.createElement("button");
                copyBtn.className =
                    "copy-code-btn";
                copyBtn.innerHTML =
                    '<i class="fa-regular fa-copy"></i> Copy';
                copyBtn.onclick =
                    async function(){
                        try{
                            await navigator
                                .clipboard
                                .writeText(
                                    codeText.trim()
                                );
                            copyBtn.innerHTML =
                                '<i class="fa-solid fa-check"></i> Copied!';
                            setTimeout(
                                function(){
                                    copyBtn.innerHTML =
                                        '<i class="fa-regular fa-copy"></i> Copy';
                                },
                                2000
                            );
                        }catch(error){
                            console.error(
                                "Copy error:",
                                error
                            );
                        }
                    };
                header.appendChild(label);
                header.appendChild(copyBtn);
                pre.parentNode.insertBefore(
                    container,
                    pre
                );
                container.appendChild(header);
                container.appendChild(pre);
                if(
                    window.hljs &&
                    code
                ){
                    try{
                        hljs.highlightElement(
                            code
                        );
                    }catch(error){}
                }
            }
        );
}
/* ============================================================
   NEW CHAT
============================================================ */
function startNewChat(
    render = true
){
    currentSessionId =
        "session_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,9);
    allSessions[
        currentSessionId
    ] = {
        id:
            currentSessionId,
        title:
            "New Chat",
        html:
            DEFAULT_WELCOME,
        isPinned:
            false,
        createdAt:
            Date.now(),
        updatedAt:
            Date.now()
    };
    localStorage.setItem(
        "tuto_current_session_id",
        currentSessionId
    );
    saveSession(
        allSessions[
            currentSessionId
        ]
    );
    if(render){
        renderSidebarHistory();
        loadSession(
            currentSessionId
        );
    }
    mobileSidebarCheck();
}
/* ============================================================
   LOAD SESSION
============================================================ */
function loadSession(id){
    if(
        !allSessions[id]
    ){
        return;
    }
    currentSessionId =
        id;
    localStorage.setItem(
        "tuto_current_session_id",
        currentSessionId
    );
    chatBox.innerHTML =
        allSessions[id].html ||
        DEFAULT_WELCOME;
    chatBox
        .querySelectorAll(".bubble")
        .forEach(
            function(bubble){
                renderMath(bubble);
                processCodeBlocks(bubble);
            }
        );
    chatBox.scrollTop =
        chatBox.scrollHeight;
    renderSidebarHistory();
    mobileSidebarCheck();
}
/* ============================================================
   DELETE SESSION
============================================================ */
async function deleteSession(
    event,
    id
){
    if(event){
        event.stopPropagation();
    }
    if(
        !allSessions[id]
    ){
        return;
    }
    if(
        !confirm("Delete this chat?")
    ){
        return;
    }
    delete allSessions[id];
    await deleteSessionFromDB(id);
    const keys =
        Object.keys(allSessions);
    if(
        currentSessionId === id
    ){
        if(keys.length){
            keys.sort(
                function(a,b){
                    return (
                        (
                            allSessions[b].updatedAt || 0
                        )
                        -
                        (
                            allSessions[a].updatedAt || 0
                        )
                    );
                }
            );
            currentSessionId =
                keys[0];
        }else{
            startNewChat(false);
        }
    }
    if(currentSessionId){
        localStorage.setItem(
            "tuto_current_session_id",
            currentSessionId
        );
    }
    renderSidebarHistory();
    loadSession(
        currentSessionId
    );
}
/* ============================================================
   PIN
============================================================ */
function togglePin(
    event,
    id
){
    if(event){
        event.stopPropagation();
    }
    if(
        allSessions[id]
    ){
        allSessions[id].isPinned =
            !allSessions[id].isPinned;
        saveSession(
            allSessions[id]
        );
        renderSidebarHistory();
    }
}
/* ============================================================
   RENAME
============================================================ */
function renameSession(id){
    if(
        !allSessions[id]
    ){
        return;
    }
    const oldTitle =
        allSessions[id].title ||
        "New Chat";
    const newTitle =
        prompt(
            "Rename chat:",
            oldTitle
        );
    if(
        newTitle === null
    ){
        return;
    }
    const cleanTitle =
        newTitle.trim();
    if(
        !cleanTitle
    ){
        return;
    }
    allSessions[id].title =
        cleanTitle.substring(
            0,
            80
        );
    saveSession(
        allSessions[id]
    );
    renderSidebarHistory();
}
/* ============================================================
   SIDEBAR HISTORY
============================================================ */
function renderSidebarHistory(){
    historyList.innerHTML = "";
    const keys =
        Object.keys(allSessions)
        .sort(
            function(a,b){
                return (
                    (
                        allSessions[b].updatedAt || 0
                    )
                    -
                    (
                        allSessions[a].updatedAt || 0
                    )
                );
            }
        );
    const pinned =
        keys.filter(
            function(id){
                return allSessions[id].isPinned;
            }
        );
    const recent =
        keys.filter(
            function(id){
                return !allSessions[id].isPinned;
            }
        );
    if(pinned.length){
        historyList.innerHTML += `
            <div class="history-label">
                PINNED
            </div>
        `;
        pinned.forEach(
            function(id){
                renderHistoryItem(id);
            }
        );
    }
    if(recent.length){
        historyList.innerHTML += `
            <div class="history-label">
                RECENT CHATS
            </div>
        `;
        recent.forEach(
            function(id){
                renderHistoryItem(id);
            }
        );
    }
}
/* ============================================================
   HISTORY ITEM
============================================================ */
function renderHistoryItem(id){
    const session =
        allSessions[id];
    const active =
        id === currentSessionId
        ? "active"
        : "";
    const item =
        document.createElement("div");
    item.className =
        "history-item " + active;
    item.dataset.id =
        id;
    item.innerHTML = `
        <div class="history-title">
            <i class="fa-regular fa-message me-2"></i>
            ${escapeHTML(
                session.title || "New Chat"
            )}
            ${
                session.isPinned
                ?
                '<i class="fa-solid fa-thumbtack pinned-icon"></i>'
                :
                ''
            }
        </div>
    `;
    item.addEventListener(
        "click",
        function(){
            loadSession(id);
        }
    );
    item.addEventListener(
        "contextmenu",
        function(e){
            e.preventDefault();
            showContextMenu(
                e.clientX,
                e.clientY,
                id
            );
        }
    );
    item.addEventListener(
        "touchstart",
        function(e){
            const touch =
                e.touches[0];
            longPressTimer =
                setTimeout(
                    function(){
                        showContextMenu(
                            touch.clientX,
                            touch.clientY,
                            id
                        );
                    },
                    600
                );
        },
        {
            passive:true
        }
    );
    item.addEventListener(
        "touchend",
        function(){
            clearTimeout(
                longPressTimer
            );
        }
    );
    item.addEventListener(
        "touchmove",
        function(){
            clearTimeout(
                longPressTimer
            );
        }
    );
    historyList.appendChild(item);
}
/* ============================================================

/* ============================================================

function fileToDataURL(file){
    return new Promise(
        function(resolve,reject){
            const reader =
                new FileReader();
            reader.onload =
                function(){
                    resolve(
                        reader.result
                    );
                };
            reader.onerror =
                reject;
            reader.readAsDataURL(file);
        }
    );
}

/* ============================================================
   EXISTING VOICE RECORDING
   THIS IS YOUR ORIGINAL MIC → TEXT FEATURE
============================================================ */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
async function toggleVoiceRecording(){
    if(isRecording){
        stopRecording();
    }else{
        startRecording();
    }
}
async function startRecording(){
    try{
        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });
        mediaRecorder =
            new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable =
            function(event){
                if(
                    event.data.size > 0
                ){
                    audioChunks.push(
                        event.data
                    );
                }
            };
        mediaRecorder.onstop =
            async function(){
                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:"audio/webm"
                        }
                    );
                stream
                    .getTracks()
                    .forEach(
                        function(track){
                            track.stop();
                        }
                    );
                await transcribeAudio(blob);
            };
        mediaRecorder.start();
        isRecording =
            true;
        micBtn.classList.add(
            "recording"
        );
        questionInput.placeholder =
            "Recording... Tap microphone to stop";
    }catch(error){
        alert(
            "Microphone permission denied or unavailable."
        );
    }
}
function stopRecording(){
    if(
        mediaRecorder &&
        isRecording
    ){
        mediaRecorder.stop();
        isRecording =
            false;
        micBtn.classList.remove(
            "recording"
        );
        questionInput.placeholder =
            "Processing voice...";
    }
}
async function transcribeAudio(blob){
    const formData =
        new FormData();
    formData.append(
        "audio",
        blob,
        "audio.webm"
    );
    try{
        const response =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );
        const data =
            await response.json();
        if(
            data.status === "success" &&
            data.text
        ){
            questionInput.value =
                data.text;
            questionInput.style.height =
                "auto";
            questionInput.style.height =
                Math.min(
                    questionInput.scrollHeight,
                    120
                ) + "px";
            updateSendButton();
        }else{
            alert(
                data.message ||
                "Voice recognition failed."
            );
        }
    }catch(error){
        alert(
            "Could not connect to voice service."
        );
    }finally{
        questionInput.placeholder =
            "Ask anything";
    }
}
/* ============================================================
   TEXT TO SPEECH
============================================================ */
function speakText(button){
    if(
        !("speechSynthesis" in window)
    ){
        alert(
            "Voice output is not supported."
        );
        return;
    }
    const bubble =
        button.closest(".bubble");
    const text =
        bubble
        ? bubble.innerText
        : "";
    if(
        window.speechSynthesis.speaking
    ){
        window.speechSynthesis.cancel();
        button.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';
        return;
    }
    const utterance =
        new SpeechSynthesisUtterance(
            text
        );
    if(
        /[\u0980-\u09FF]/.test(text)
    ){
        utterance.lang =
            "bn-BD";
    }else{
        utterance.lang =
            "en-US";
    }
    button.innerHTML =
        '<i class="fa-solid fa-volume-xmark text-warning"></i>';
    utterance.onend =
        function(){
            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';
        };
    window.speechSynthesis.speak(
        utterance
    );
}
/* ============================================================
   SEND BUTTON MODE
============================================================ */
function updateSendButton(){
    const sendBtn =
        document.getElementById(
            "sendBtn"
        );
    const icon =
        document.getElementById(
            "sendBtnIcon"
        );
    const hasText =
        questionInput.value.trim().length > 0;
    /*
     * If user typed something:
     * SEND ARROW
     */
    if(hasText){
        sendBtn.classList.remove(
            "voice-mode"
        );
        sendBtn.classList.add(
            "send-mode"
        );
        sendBtn.title =
            "Send";
        icon.className =
            "fa-solid fa-arrow-up";
        return;
    }
    /*
     * If input is empty:
     * BLUE VOICE BUTTON
     */
    sendBtn.classList.remove(
        "send-mode"
    );
    sendBtn.classList.add(
        "voice-mode"
    );
    sendBtn.title =
        "Open Voice Assistant";
    icon.className =
        "fa-solid fa-waveform-lines";
}
/* ============================================================
   SEND OR OPEN VOICE
============================================================ */
function handleSendOrVoice(){
    const text =
        questionInput.value.trim();
    if(!text){
        openVoiceAssistant();
        return;
    }
    document
        .getElementById("chatForm")
        .dispatchEvent(
            new Event("submit")
        );
}
/* ============================================================
   SEND MESSAGE
============================================================ */
document
    .getElementById("chatForm")
    .addEventListener(
        "submit",
        async function(e){
            e.preventDefault();
            const question =
                questionInput.value.trim();
            if(
                !question &&
                !selectedFile
            ){
                return;
            }
            const sendBtn =
                document.getElementById(
                    "sendBtn"
                );
            /*
             * SAVE SESSION ID
             */
            const messageSessionId =
                currentSessionId;
            /*
             * USER MESSAGE
             */
            let userHTML = "";
            if(question){
                userHTML += `
                    <strong>You</strong><br>
                    ${escapeHTML(
                        question
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                `;
            }
            if(selectedFile){
                if(
                    selectedFile.type ===
                    "application/pdf"
                ){
                    userHTML =
                        `
                        <div class="pdf-badge">
                            <i class="fa-solid fa-file-pdf"></i>
                            ${escapeHTML(
                                selectedFile.name
                            )}
                        </div>
                        ` +
                        (
                            userHTML
                            ?
                            "<br>" + userHTML
                            :
                            ""
                        );
                }else{
                    const imageSrc =
                        selectedFileDataURL ||
                        URL.createObjectURL(
                            selectedFile
                        );
                    userHTML =
                        `
                        <img
                            src="${imageSrc}"
                            class="uploaded-img-preview"
                            alt="Uploaded image">
                        ` +
                        (
                            userHTML
                            ?
                            "<br>" + userHTML
                            :
                            ""
                        );
                }
            }
            chatBox.innerHTML += `
                <div class="message">
                    <div class="avatar user-avatar">
                        You
                    </div>
                    <div class="bubble">
                        ${userHTML}
                    </div>
                </div>
            `;
            /*
             * FORM DATA
             */
            const formData =
                new FormData();
            formData.append(
                "question",
                question
            );
            formData.append(
                "session_id",
                messageSessionId
            );
            if(selectedFile){
                formData.append(
                    "file",
                    selectedFile
                );
            }
            /*
             * TITLE
             */
            const shouldGenerateTitle =
                allSessions[messageSessionId] &&
                allSessions[messageSessionId].title ===
                    "New Chat";
            const titleQuestion =
                question ||
                (
                    selectedFile
                    ?
                    "Image or document analysis"
                    :
                    ""
                );
            /*
             * CLEAR INPUT
             */
            questionInput.value = "";
            questionInput.style.height =
                "auto";
            clearSelectedFile();
            updateSendButton();
            sendBtn.disabled =
                true;
            chatBox.scrollTop =
                chatBox.scrollHeight;
            /*
             * LOADING
             */
            const loadingId =
                "loading-" +
                Date.now();
            chatBox.innerHTML += `
                <div
                    class="message"
                    id="${loadingId}">
                    <div class="avatar ai-avatar">
                        AI
                    </div>
                    <div class="bubble text-secondary">
                        <i class="fa-solid fa-circle-notch fa-spin me-2"></i>
                        Thinking...
                    </div>
                </div>
            `;
            chatBox.scrollTop =
                chatBox.scrollHeight;
            try{
                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method:"POST",
                            body:formData
                        }
                    );
                const data =
                    await response.json();
                const loading =
                    document.getElementById(
                        loadingId
                    );
                if(
                    data.status === "success"
                ){
                    let content =
                        data.response || "";
                    try{
                        content =
                            marked.parse(
                                content
                            );
                    }catch(error){
                        content =
                            escapeHTML(
                                data.response
                            ).replace(
                                /\n/g,
                                "<br>"
                            );
                    }
                    if(loading){
                        const bubble =
                            loading.querySelector(
                                ".bubble"
                            );
                        bubble.classList.remove(
                            "text-secondary"
                        );
                        bubble.innerHTML = `
                            <div
                                class="d-flex
                                justify-content-between
                                align-items-center
                                mb-1">
                                <strong>
                                    Tuto AI
                                </strong>
                                <button
                                    class="tts-btn"
                                    onclick="speakText(this)"
                                    title="Read Aloud">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                            <div>
                                ${content}
                            </div>
                        `;
                        processCodeBlocks(
                            bubble
                        );
                        renderMath(
                            bubble
                        );
                    }
                    /*
                     * SAVE CHAT
                     */
                    if(
                        allSessions[
                            messageSessionId
                        ]
                    ){
                        allSessions[
                            messageSessionId
                        ].html =
                            chatBox.innerHTML;
                        allSessions[
                            messageSessionId
                        ].updatedAt =
                            Date.now();
                        await saveSession(
                            allSessions[
                                messageSessionId
                            ]
                        );
                    }
                    /*
                     * AUTOMATIC TITLE
                     */
                    if(
                        shouldGenerateTitle &&
                        titleQuestion
                    ){
                        generateTitle(
                            titleQuestion,
                            messageSessionId
                        );
                    }
                }else{
                    if(loading){
                        loading.querySelector(
                            ".bubble"
                        ).innerHTML = `
                            <span class="text-danger">
                                Error:
                                ${escapeHTML(
                                    data.message ||
                                    "Something went wrong."
                                )}
                            </span>
                        `;
                    }
                }
            }catch(error){
                console.error(
                    "Chat error:",
                    error
                );
                const loading =
                    document.getElementById(
                        loadingId
                    );
                if(loading){
                    loading.querySelector(
                        ".bubble"
                    ).innerHTML = `
                        <span class="text-danger">
                            Server connection error.
                        </span>
                    `;
                }
            }finally{
                sendBtn.disabled =
                    false;
                updateSendButton();
                chatBox.scrollTop =
                    chatBox.scrollHeight;
            }
        }
    );
/* ============================================================
   AI AUTOMATIC CHAT TITLE
============================================================ */
async function generateTitle(
    prompt,
    sessionId
){
    if(
        !prompt ||
        !prompt.trim() ||
        !sessionId
    ){
        return;
    }
    try{
        const formData =
            new FormData();
        formData.append(
            "prompt",
            prompt.trim()
        );
        formData.append(
            "session_id",
            sessionId
        );
        const response =
            await fetch(
                "/api/generate-title",
                {
                    method:"POST",
                    body:formData
                }
            );
        if(!response.ok){
            console.error(
                "Title API error:",
                response.status
            );
            return;
        }
        const data =
            await response.json();
        if(
            data.status !== "success" ||
            !data.title ||
            !allSessions[sessionId]
        ){
            return;
        }
        let title =
            String(
                data.title
            ).trim();
        title =
            title
                .replace(
                    /^["'“”‘’]+/,
                    ""
                )
                .replace(
                    /["'“”‘’]+$/,
                    ""
                )
                .trim();
        title =
            title
                .replace(
                    /\s+/g,
                    " "
                )
                .trim();
        if(title.length > 60){
            title =
                title
                    .substring(0,60)
                    .trim();
        }
        if(!title){
            return;
        }
        if(
            allSessions[sessionId].title !==
            "New Chat"
        ){
            return;
        }
        allSessions[
            sessionId
        ].title =
            title;
        allSessions[
            sessionId
        ].updatedAt =
            Date.now();
        await saveSession(
            allSessions[
                sessionId
            ]
        );
        renderSidebarHistory();
    }catch(error){
        console.error(
            "Automatic title generation error:",
            error
        );
    }
}
/* ============================================================
   VOICE ASSISTANT
============================================================ */
const voiceOverlay =
    document.getElementById(
        "voiceAssistantOverlay"
    );
const voiceStatus =
    document.getElementById(
        "voiceStatus"
    );
const voiceTranscript =
    document.getElementById(
        "voiceTranscript"
    );
const voiceOrb =
    document.getElementById(
        "voiceOrb"
    );
const voiceMainBtn =
    document.getElementById(
        "voiceMainBtn"
    );
let voiceAssistantRecorder = null;
let voiceAssistantChunks = [];
let voiceAssistantRecording = false;
let voiceAssistantProcessing = false;
/* ============================================================
   OPEN VOICE ASSISTANT
============================================================ */
function openVoiceAssistant(){
    voiceOverlay.classList.add(
        "show"
    );
    voiceStatus.innerText =
        "Tap the microphone and start speaking";
    voiceTranscript.innerText =
        "I'm ready to listen...";
    voiceAssistantProcessing =
        false;
}
/* ============================================================
   CLOSE VOICE ASSISTANT
============================================================ */
function closeVoiceAssistant(){
    stopVoiceAssistantRecording();
    if(
        window.speechSynthesis
    ){
        window.speechSynthesis.cancel();
    }
    voiceOverlay.classList.remove(
        "show"
    );
}
/* ============================================================
   VOICE ASSISTANT RECORDING
============================================================ */
async function toggleVoiceAssistantRecording(){
    if(
        voiceAssistantProcessing
    ){
        return;
    }
    if(
        voiceAssistantRecording
    ){
        stopVoiceAssistantRecording();
    }else{
        startVoiceAssistantRecording();
    }
}
/* ============================================================
   START VOICE ASSISTANT RECORDING
============================================================ */
async function startVoiceAssistantRecording(){
    try{
        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });
        voiceAssistantRecorder =
            new MediaRecorder(stream);
        voiceAssistantChunks = [];
        voiceAssistantRecorder.ondataavailable =
            function(event){
                if(
                    event.data.size > 0
                ){
                    voiceAssistantChunks.push(
                        event.data
                    );
                }
            };
        voiceAssistantRecorder.onstop =
            async function(){
                const blob =
                    new Blob(
                        voiceAssistantChunks,
                        {
                            type:"audio/webm"
                        }
                    );
                stream
                    .getTracks()
                    .forEach(
                        function(track){
                            track.stop();
                        }
                    );
                await processVoiceAssistantAudio(
                    blob
                );
            };
        voiceAssistantRecorder.start();
        voiceAssistantRecording =
            true;
        voiceMainBtn.classList.add(
            "recording"
        );
        voiceMainBtn.innerHTML =
            '<i class="fa-solid fa-stop"></i>';
        voiceOrb.classList.add(
            "active"
        );
        voiceStatus.innerText =
            "Listening... Tap again when finished";
        voiceTranscript.innerText =
            "Listening...";
    }catch(error){
        console.error(
            "Voice Assistant microphone error:",
            error
        );
        voiceStatus.innerText =
            "Microphone permission denied or unavailable.";
    }
}
/* ============================================================
   STOP VOICE ASSISTANT RECORDING
============================================================ */
function stopVoiceAssistantRecording(){
    if(
        voiceAssistantRecorder &&
        voiceAssistantRecording
    ){
        voiceAssistantRecorder.stop();
    }
    voiceAssistantRecording =
        false;
    voiceMainBtn.classList.remove(
        "recording"
    );
    voiceMainBtn.innerHTML =
        '<i class="fa-solid fa-microphone"></i>';
    voiceOrb.classList.remove(
        "active"
    );
}
/* ============================================================
   PROCESS VOICE
============================================================ */
async function processVoiceAssistantAudio(blob){
    voiceAssistantProcessing =
        true;
    voiceStatus.innerText =
        "Converting your voice to text...";
    try{
        /*
         * STEP 1:
         * VOICE → TEXT
         */
        const transcriptionForm =
            new FormData();
        transcriptionForm.append(
            "audio",
            blob,
            "voice-assistant.webm"
        );
        const transcriptionResponse =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:transcriptionForm
                }
            );
        const transcriptionData =
            await transcriptionResponse.json();
        if(
            transcriptionData.status !== "success" ||
            !transcriptionData.text
        ){
            throw new Error(
                transcriptionData.message ||
                "Voice transcription failed."
            );
        }
        const userText =
            transcriptionData.text.trim();
        voiceTranscript.innerHTML = `
            <strong>You:</strong><br>
            ${escapeHTML(userText)}
        `;
        /*
         * STEP 2:
         * SEND TEXT TO AI
         */
        voiceStatus.innerText =
            "Tuto AI is thinking...";
        const chatFormData =
            new FormData();
        chatFormData.append(
            "question",
            userText
        );
        chatFormData.append(
            "session_id",
            currentSessionId
        );
        const chatResponse =
            await fetch(
                "/api/chat",
                {
                    method:"POST",
                    body:chatFormData
                }
            );
        const chatData =
            await chatResponse.json();
        if(
            chatData.status !== "success"
        ){
            throw new Error(
                chatData.message ||
                "AI response failed."
            );
        }
        const answer =
            chatData.response ||
            "Sorry, I couldn't answer that.";
        /*
         * SHOW ANSWER
         */
        voiceTranscript.innerHTML = `
            <strong>You:</strong><br>
            ${escapeHTML(userText)}
            <br><br>
            <strong>Tuto AI:</strong><br>
            ${escapeHTML(answer)}
        `;
        /*
         * STEP 3:
         * AI → VOICE
         */
        voiceStatus.innerText =
            "Tuto AI is speaking...";
        speakVoiceAssistant(
            answer
        );
        /*
         * ALSO SAVE THE VOICE CHAT
         * INTO NORMAL CHAT HISTORY
         */
        addVoiceConversationToChat(
            userText,
            answer
        );
    }catch(error){
        console.error(
            "Voice Assistant error:",
            error
        );
        voiceStatus.innerText =
            "Something went wrong. Please try again.";
    }finally{
        voiceAssistantProcessing =
            false;
    }
}
/* ============================================================
   ADD VOICE CHAT TO NORMAL CHAT
============================================================ */
async function addVoiceConversationToChat(
    userText,
    answer
){
    try{
        /*
         * Don't duplicate the complete voice
         * assistant UI. Just add the conversation
         * to normal Tuto AI chat history.
         */
        const answerHTML =
            marked.parse(
                answer
            );
        chatBox.innerHTML += `
            <div class="message">
                <div class="avatar user-avatar">
                    You
                </div>
                <div class="bubble">
                    <strong>You</strong><br>
                    ${escapeHTML(
                        userText
                    ).replace(
                        /\n/g,
                        "<br>"
                    )}
                </div>
            </div>
            <div class="message">
                <div class="avatar ai-avatar">
                    AI
                </div>
                <div class="bubble">
                    <div
                        class="d-flex
                        justify-content-between
                        align-items-center
                        mb-1">
                        <strong>
                            Tuto AI
                        </strong>
                        <button
                            class="tts-btn"
                            onclick="speakText(this)"
                            title="Read Aloud">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <div>
                        ${answerHTML}
                    </div>
                </div>
            </div>
        `;
        const bubbles =
            chatBox.querySelectorAll(
                ".bubble"
            );
        const lastBubble =
            bubbles[bubbles.length - 1];
        processCodeBlocks(
            lastBubble
        );
        renderMath(
            lastBubble
        );
        chatBox.scrollTop =
            chatBox.scrollHeight;
        /*
         * SAVE TO CURRENT SESSION
         */
        if(
            allSessions[currentSessionId]
        ){
            allSessions[
                currentSessionId
            ].html =
                chatBox.innerHTML;
            allSessions[
                currentSessionId
            ].updatedAt =
                Date.now();
            await saveSession(
                allSessions[
                    currentSessionId
                ]
            );
        }
    }catch(error){
        console.error(
            "Could not save voice chat:",
            error
        );
    }
}
/* ============================================================
   VOICE ASSISTANT TTS
============================================================ */
function speakVoiceAssistant(text){
    if(
        !("speechSynthesis" in window)
    ){
        voiceStatus.innerText =
            "Voice output is not supported on this device.";
        return;
    }
    window.speechSynthesis.cancel();
    /*
     * Remove markdown/code before speaking.
     */
    const cleanText =
        String(text)
            .replace(
                /```[\s\S]*?```/g,
                ""
            )
            .replace(
                /[*_#>`]/g,
                ""
            )
            .replace(
                /\[([^\]]+)\]\([^)]+\)/g,
                "$1"
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();
    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );
    /*
     * Bengali detection
     */
    if(
        /[\u0980-\u09FF]/.test(
            cleanText
        )
    ){
        utterance.lang =
            "bn-BD";
    }else{
        utterance.lang =
            "en-US";
    }
    utterance.rate =
        1;
    utterance.pitch =
        1;
    utterance.onstart =
        function(){
            voiceOrb.classList.add(
                "active"
            );
            voiceStatus.innerText =
                "Tuto AI is speaking...";
        };
    utterance.onend =
        function(){
            voiceOrb.classList.remove(
                "active"
            );
            voiceStatus.innerText =
                "Tap the microphone to speak again.";
        };
    utterance.onerror =
        function(){
            voiceOrb.classList.remove(
                "active"
            );
            voiceStatus.innerText =
                "Voice playback failed.";
        };
    window.speechSynthesis.speak(
        utterance
    );
}
/* ============================================================
   CLOSE VOICE ASSISTANT WHEN CLICKING OUTSIDE
============================================================ */
voiceOverlay.addEventListener(
    "click",
    function(e){
        if(
            e.target === voiceOverlay
        ){
            closeVoiceAssistant();
        }
    }
);
/* ============================================================
   ESC
============================================================ */
document.addEventListener(
    "keydown",
    function(e){
        if(
            e.key === "Escape"
        ){
            hideContextMenu();
            if(
                voiceOverlay.classList.contains(
                    "show"
                )
            ){
                closeVoiceAssistant();
            }
        }
    }
);
/* ============================================================
   INITIAL SEND BUTTON
============================================================ */
updateSendButton();
