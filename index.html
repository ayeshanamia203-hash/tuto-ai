<html lang="en">
<head>
<meta charset="UTF-8">

<title>Tuto AI</title>

<link

    rel="stylesheet"
>

<link

    defer

<style>

:root{
    --bg:#0b0d10;
    --panel:#11151a;
    --panel2:#171c22;
    --border:#252b33;
    --text:#f5f7fa;
    --muted:#9aa4b2;
    --accent:#6ea8fe;
    --bubble:#171c22;
    --user:#263b58;
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

[data-theme="light"]{
    --bg:#f5f7fa;
    --panel:#ffffff;
    --panel2:#f0f3f7;
    --border:#dfe4ea;
    --text:#18202a;
    --muted:#697586;
    --accent:#2563eb;
    --bubble:#ffffff;
    --user:#e8f0ff;
    --shadow:0 15px 45px rgba(20,30,50,.12);
}

*{
    box-sizing:border-box;
}

html,
body{
    height:100%;
    margin:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

.app{
    height:100dvh;
    display:flex;
}

.sidebar{
    width:290px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    transition:.25s;
    z-index:20;
}

.sidebar.collapsed{
    width:0;
    overflow:hidden;
    border:0;
}

.sidebar-top{
    padding:18px;
}

.brand{
    font-weight:800;
    font-size:21px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.brand-badge,
.avatar{
    display:grid;
    place-items:center;
    font-weight:800;
}

.brand-badge{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
}

.new-chat{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:12px;
    padding:11px 14px;
    text-align:left;
}

.history{
    padding:0 10px;
    overflow:auto;
    flex:1;
}

.history-label{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:.08em;
    padding:14px 10px 7px;
}

.history-item{
    padding:11px 12px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:3px;
    position:relative;
}

.history-item:hover,
.history-item.active{
    background:var(--panel2);
}

.history-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding-right:4px;
}

.pinned-icon{
    font-size:11px;
    margin-left:5px;
    color:var(--accent);
}

.sidebar-bottom{
    padding:12px;
    border-top:1px solid var(--border);
}

.theme-btn{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:10px;
    border-radius:10px;
    text-align:left;
}

.theme-btn:hover{
    background:var(--panel2);
}

.main{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:62px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    background:var(--panel);
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:var(--text);
    border-radius:10px;
}

.icon-btn:hover{
    background:var(--panel2);
}

.top-title{
    font-weight:750;
}

.chat-box{
    flex:1;
    overflow:auto;
    padding:
        28px
        max(18px,calc((100% - 900px)/2));
    scroll-behavior:smooth;
}

.welcome-screen{
    min-height:60vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.welcome-avatar{
    width:72px;
    height:72px;
    border-radius:22px;
    background:var(--accent);
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:24px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.message{
    display:flex;
    gap:12px;
    margin:0 auto 22px;
    max-width:900px;
}

.avatar{
    flex:
        0 0 38px;
    width:38px;
    height:38px;
    border-radius:12px;
    font-size:12px;
}

.user-avatar{
    background:var(--user);
    color:var(--text);
}

.ai-avatar{
    background:var(--accent);
    color:white;
}

.bubble{
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px 15px;
    line-height:1.6;
    min-width:0;
    overflow-wrap:anywhere;
    box-shadow:0 4px 18px rgba(0,0,0,.04);
}

.bubble img{
    max-width:100%;
}

.bubble p:last-child{
    margin-bottom:0;
}

.bubble pre{
    overflow:auto;
    background:#0d1117;
    border-radius:10px;
    padding:13px;
    margin-top:10px;
}

.code-container{
    margin:10px 0;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:#0d1117;
}

.code-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 11px;
    background:#151b23;
    color:#aab4c3;
    font-size:12px;
}

.copy-code-btn{
    border:1px solid #394352;
    background:transparent;
    color:#dce3ec;
    border-radius:7px;
    padding:4px 9px;
    font-size:12px;
}

.code-container pre{
    margin:0;
    border-radius:0;
}

.tts-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:3px 7px;
    border-radius:7px;
}

.tts-btn:hover{
    background:var(--panel2);
    color:var(--text);
}

.composer-wrap{
    padding:12px 18px 18px;
    background:
        linear-gradient(
            transparent,
            var(--bg) 25%
        );
}

.composer{
    max-width:900px;
    margin:auto;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:18px;
    padding:10px;
    box-shadow:var(--shadow);
}

textarea{
    width:100%;
    border:0;
    outline:0;
    resize:none;
    background:transparent;
    color:var(--text);
    max-height:120px;
    padding:6px 8px;
}

.composer-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.attach-btn,
.mic-btn,
.send-btn{
    border:0;
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--panel2);
    color:var(--text);
}

.send-btn.send-mode{
    background:var(--accent);
    color:white;
}

.send-btn.voice-mode{
    background:var(--panel2);
}

.mic-btn.recording{
    background:#dc3545;
    color:#fff;
}

.file-preview{
    display:none;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
}

.file-preview img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:8px;
}

.pdf-badge{
    display:inline-flex;
    gap:8px;
    align-items:center;
    background:var(--panel2);
    padding:8px 10px;
    border-radius:8px;
}

.uploaded-img-preview{
    max-width:240px;
    border-radius:12px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    display:none;
    z-index:15;
}

.overlay.active{
    display:block;
}

.context-menu{
    position:fixed;
    display:none;
    z-index:100;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:6px;
    width:190px;
}

.context-menu.show{
    display:block;
}

.context-menu button{
    display:block;
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:9px 10px;
    text-align:left;
    border-radius:8px;
}

.context-menu button:hover{
    background:var(--panel2);
}


/* ============================================================
   VOICE ASSISTANT
============================================================ */

.voice-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:18px;
}

.voice-overlay.show{
    display:flex;
}

.voice-panel{
    width:min(620px,100%);
    min-height:520px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.voice-close{
    position:absolute;
    right:16px;
    top:16px;
}

.voice-orb{
    width:180px;
    height:180px;
    border-radius:50%;
    margin:35px 0 20px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #9bc2ff,
            #2563eb 45%,
            #101b36 75%
        );

    box-shadow:
        0 0 0 0
        rgba(37,99,235,.4);

    display:grid;
    place-items:center;
    transition:.3s;
}

.voice-orb.active{
    animation:orbPulse 1.8s infinite;
}

.voice-orb.listening{
    transform:scale(1.06);
}

.voice-orb.speaking{
    animation:orbSpeak .8s infinite alternate;
}

@keyframes orbPulse{

    0%,
    100%{
        box-shadow:
            0 0 0 0
            rgba(37,99,235,.25);
    }

    50%{
        box-shadow:
            0 0 0 28px
            rgba(37,99,235,0);
    }

}

@keyframes orbSpeak{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }

}

.voice-orb i{
    font-size:52px;
    color:#fff;
}

.voice-status{
    color:var(--muted);
    text-align:center;
}

.voice-transcript{
    width:100%;
    max-height:190px;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:15px;
    padding:14px;
    margin:18px 0;
}

.voice-user-line{
    margin-bottom:12px;
}

.voice-ai-line{
    padding-top:12px;
    border-top:1px solid var(--border);
}

.voice-main-btn{
    width:68px;
    height:68px;
    border:0;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:24px;
}

.voice-main-btn.recording{
    background:#dc3545;
}

.voice-main-btn.processing{
    opacity:.75;
}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:768px){

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
    }

    .chat-box{
        padding:20px 12px;
    }

    .composer-wrap{
        padding:8px 10px 12px;
    }

    .message{
        gap:8px;
    }

    .avatar{
        flex-basis:34px;
        width:34px;
        height:34px;
    }

    .voice-panel{
        min-height:90vh;
    }

}

<script>
      
<script>

/* ============================================================
   INDEXEDDB CHAT STORAGE
============================================================ */

const DB_NAME = "TutoAI_DB";
const DB_VERSION = 1;
const STORE_NAME = "sessions";

let db = null;

/* ============================================================
   OPEN DATABASE
============================================================ */

function openDatabase(){

    return new Promise(function(resolve, reject){

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

        request.onupgradeneeded =
            function(event){

                const database =
                    event.target.result;

                if(
                    !database.objectStoreNames.contains(
                        STORE_NAME
                    )
                ){

                    database.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath:"id"
                        }
                    );

                }

            };

        request.onsuccess =
            function(event){

                db =
                    event.target.result;

                resolve(db);

            };

        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}

/* ============================================================
   SAVE SESSION
============================================================ */

async function saveSession(session){

    if(!session || !session.id){
        return;
    }

    try{

        if(!db){
            await openDatabase();
        }

        return new Promise(
            function(resolve, reject){

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );

                const request =
                    store.put(session);

                request.onsuccess =
                    function(){

                        resolve(true);

                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );

    }catch(error){

        console.error(
            "Save session error:",
            error
        );

    }

}

/* ============================================================
   LOAD ALL SESSIONS
============================================================ */

async function loadSessions(){

    try{

        if(!db){
            await openDatabase();
        }

        return new Promise(
            function(resolve, reject){

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readonly"
                    );

                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );

                const request =
                    store.getAll();

                request.onsuccess =
                    function(){

                        const sessions =
                            request.result || [];

                        const result = {};

                        sessions.forEach(
                            function(session){

                                if(
                                    session &&
                                    session.id
                                ){

                                    result[
                                        session.id
                                    ] =
                                        session;

                                }

                            }
                        );

                        resolve(result);

                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );

    }catch(error){

        console.error(
            "Load sessions error:",
            error
        );

        return {};

    }

}

/* ============================================================
   DELETE SESSION
============================================================ */

async function deleteSession(
    sessionId
){

    if(!sessionId){
        return;
    }

    try{

        if(!db){
            await openDatabase();
        }

        return new Promise(
            function(resolve, reject){

                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );

                const request =
                    store.delete(
                        sessionId
                    );

                request.onsuccess =
                    function(){

                        resolve(true);

                    };

                request.onerror =
                    function(){

                        reject(
                            request.error
                        );

                    };

            }
        );

    }catch(error){

        console.error(
            "Delete session error:",
            error
        );

    }

}

async function initializeSessions(){

            );

        if(
            sessions.length === 0
        ){

            createNewSession();

            return;

        }

        sessions.sort(
            function(a,b){

                return (
                    (b.updatedAt || 0)
                    -
                    (a.updatedAt || 0)
                );

            }
        );

        currentSessionId =
            sessions[0].id;

        chatBox.innerHTML =
            sessions[0].html || "";

        renderSidebarHistory();

            chatBox.scrollHeight;

/* ============================================================
   SIDEBAR HISTORY
============================================================ */

function renderSidebarHistory(){

    const historyContainer =
        document.getElementById(
            "historyList"
        );

    if(!historyContainer){
        return;
    }

    historyContainer.innerHTML =
        "";

    const sessions =
        Object.values(
            allSessions
        );

    sessions.sort(
        function(a,b){

            return (
                (b.updatedAt || 0)
                -
                (a.updatedAt || 0)
            );

        }
    );

    sessions.forEach(
        function(session){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            if(
                session.id ===
                currentSessionId
            ){

                item.classList.add(
                    "active"
                );

            }

            const title =
                session.title ||
                "New Chat";

            item.innerHTML = `
                <div class="history-item-content">
                    <i class="fa-regular fa-message"></i>
                    <span>
                        ${escapeHTML(title)}
                    </span>
                </div>

                <button
                    class="history-delete-btn"
                    type="button"
                    title="Delete chat">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;

            const deleteButton =
                item.querySelector(
                    ".history-delete-btn"
                );

            deleteButton.addEventListener(
                "click",
                async function(event){

                    event.stopPropagation();

                    const confirmed =
                        confirm(
                            "Delete this chat?"
                        );

                    if(!confirmed){
                        return;
                    }

                    await deleteSession(
                        session.id
                    );

                    delete allSessions[
                        session.id
                    ];

                    if(
                        session.id ===
                        currentSessionId
                    ){

                        const remaining =
                            Object.values(
                                allSessions
                            );

                        if(
                            remaining.length
                        ){

                            remaining.sort(
                                function(a,b){

                                    return (
                                        (b.updatedAt || 0)
                                        -
                                        (a.updatedAt || 0)
                                    );

                                }
                            );

                            loadSession(
                                remaining[0].id
                            );

                        }else{

                            createNewSession();

                        }

                    }else{

                        renderSidebarHistory();

                    }

                }
            );

            item.addEventListener(
                "click",
                function(){

                    loadSession(
                        session.id
                    );

                }
            );

            historyContainer.appendChild(
                item
            );

        }
    );

}

let mediaRecorder =

let audioChunks =

let isRecording =

/* ============================================================
   COMPATIBLE RECORDER
============================================================ */

function createCompatibleRecorder(
    stream
){

    if(
        !window.MediaRecorder
    ){

        return null;

    }

    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/mp4",

        "audio/ogg;codecs=opus"

    ];

    for(
        let i = 0;
        i < types.length;
        i++
    ){

        try{

            if(
                MediaRecorder.isTypeSupported(
                    types[i]
                )
            ){

                return new MediaRecorder(
                    stream,
                    {
                        mimeType:types[i]
                    }
                );

            }

        }catch(error){}

    }

    try{

        return new MediaRecorder(
            stream
        );

    }catch(error){

        return null;

    }

}

/* ============================================================
   START NORMAL RECORDING
============================================================ */

async function startRecording(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            alert(
                "Microphone is not supported."
            );

            return;

        }

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });

        mediaRecorder =
            createCompatibleRecorder(
                stream
            );

        if(!mediaRecorder){

            stream
                .getTracks()
                .forEach(
                    function(track){
                        track.stop();
                    }
                );

            alert(
                "Audio recording is not supported."
            );

            return;

        }

        audioChunks =
            [];

        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };

        mediaRecorder.onstop =
            async function(){

                const mimeType =
                    mediaRecorder.mimeType ||
                    "audio/webm";

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:mimeType
                        }
                    );

                stream
                    .getTracks()
                    .forEach(
                        function(track){
                            track.stop();
                        }
                    );

                await transcribeAudio(
                    blob
                );

            };

        mediaRecorder.start();

        isRecording =
            true;

        micBtn.classList.add(
            "recording"
        );

        questionInput.placeholder =
            "Listening... Tap microphone again";

    }catch(error){

        console.error(
            "Microphone error:",
            error
        );

        alert(
            "Microphone permission denied or unavailable."
        );

    }

}

/* ============================================================
   STOP NORMAL RECORDING
============================================================ */

function stopRecording(){

    if(
        mediaRecorder &&
        isRecording
    ){

        try{

            mediaRecorder.stop();

        }catch(error){}

    }

    isRecording =
        false;

    if(micBtn){

        micBtn.classList.remove(
            "recording"
        );

    }

}

/* ============================================================
   TEXT TO SPEECH — NORMAL CHAT
============================================================ */

function speakText(button){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Voice output is not supported."
        );

        return;

    }

    const bubble =
        button.closest(
            ".bubble"
        );

    let text =
        bubble
        ? bubble.innerText
        : "";

    /* Remove button text from speech */
    text =
        text
        .replace(
            "Read Aloud",
            ""
        )
        .trim();

    if(
        window.speechSynthesis.speaking
    ){

        window.speechSynthesis.cancel();

        button.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';

        return;

    }

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    if(
        /[\u0980-\u09FF]/.test(
            text
        )
    ){

        utterance.lang =
            "bn-BD";

    }else{

        utterance.lang =
            "en-US";

    }

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    const voices =
        window.speechSynthesis
        .getVoices();

    if(
        voices &&
        voices.length
    ){

        const matchingVoice =
            voices.find(
                function(voice){

                    const lang =
                        String(
                            voice.lang || ""
                        ).toLowerCase();

                    if(
                        /[\u0980-\u09FF]/.test(
                            text
                        )
                    ){

                        return lang.startsWith(
                            "bn"
                        );

                    }

                    return lang.startsWith(
                        "en"
                    );

                }
            );

        if(matchingVoice){

            utterance.voice =
                matchingVoice;

        }

    }

    button.innerHTML =
        '<i class="fa-solid fa-volume-xmark text-warning"></i>';

    utterance.onend =
        function(){

            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

        };

    utterance.onerror =
        function(){

            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

        };

    window.speechSynthesis.speak(
        utterance
    );

}

                    error
                );

                const loading =
                    document.getElementById(
                        loadingId
                    );

                if(loading){

                    loading.querySelector(
                        ".bubble"
                    ).innerHTML = `

                        <span class="text-danger">

                            Server connection error.

                        </span>

                    `;

                }

            }finally{

                sendBtn.disabled =
                    false;

                updateSendButton();

                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }

        }
    );


/* ============================================================
   AUTOMATIC CHAT TITLE
============================================================ */

async function generateTitle(
    prompt,
    sessionId
){

    if(
        !prompt ||
        !prompt.trim() ||
        !sessionId
    ){

        return;

    }

    try{

        const formData =
            new FormData();

        formData.append(
            "prompt",
            prompt.trim()
        );

        const response =
            await fetch(
                "/api/generate-title",
                {
                    method:"POST",
                    body:formData
                }
            );

        if(!response.ok){

            console.error(
                "Title API error:",
                response.status
            );

            return;

        }

        const data =
            await response.json();

        if(
            data.status !==
                "success" ||
            !data.title ||
            !allSessions[
                sessionId
            ]
        ){

            return;

        }

        let title =
            String(
                data.title
            ).trim();

        title =
            title
            .replace(
                /^["'“”‘’]+/,
                ""
            )
            .replace(
                /["'“”‘’]+$/,
                ""
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();

        if(
            title.length > 60
        ){

            title =
                title
                .substring(
                    0,
                    60
                )
                .trim();

        }

        if(!title){

            return;

        }

        if(
            allSessions[
                sessionId
            ].title !==
            "New Chat"
        ){

            return;

        }

        allSessions[
            sessionId
        ].title =
            title;

        allSessions[
            sessionId
        ].updatedAt =
            Date.now();

        await saveSession(
            allSessions[
                sessionId
            ]
        );

        renderSidebarHistory();

    }catch(error){

        console.error(
            "Automatic title generation error:",
            error
        );

    }

}


/* ============================================================
   VOICE ASSISTANT
============================================================ */

const voiceOverlay =
    document.getElementById(
        "voiceAssistantOverlay"
    );

const voiceStatus =
    document.getElementById(
        "voiceStatus"
    );

const voiceTranscript =
    document.getElementById(
        "voiceTranscript"
    );

const voiceOrb =
    document.getElementById(
        "voiceOrb"
    );

const voiceMainBtn =
    document.getElementById(
        "voiceMainBtn"
    );


let voiceAssistantRecorder =
    null;

let voiceAssistantChunks =
    [];

let voiceAssistantRecording =
    false;

let voiceAssistantProcessing =
    false;


/* ============================================================
   OPEN VOICE ASSISTANT
============================================================ */

function openVoiceAssistant(){

    voiceOverlay.classList.add(
        "show"
    );

    voiceStatus.innerText =
        "Tap the microphone and start speaking";

    voiceTranscript.innerHTML = `
        <div class="text-secondary">
            I'm ready to listen...
        </div>
    `;

    voiceAssistantProcessing =
        false;

    voiceAssistantRecording =
        false;

    voiceOrb.classList.remove(
        "active",
        "listening",
        "speaking"
    );

    voiceMainBtn.classList.remove(
        "recording",
        "processing"
    );

    voiceMainBtn.innerHTML =
        '<i class="fa-solid fa-microphone"></i>';

}


/* ============================================================
   CLOSE VOICE ASSISTANT
============================================================ */

function closeVoiceAssistant(){

    stopVoiceAssistantRecording();

    if(
        window.speechSynthesis
    ){

        window.speechSynthesis.cancel();

    }

    voiceAssistantProcessing =
        false;

    voiceOrb.classList.remove(
        "active",
        "listening",
        "speaking"
    );

    voiceOverlay.classList.remove(
        "show"
    );

}


/* ============================================================
   TOGGLE RECORDING
============================================================ */

async function toggleVoiceAssistantRecording(){

    if(
        voiceAssistantProcessing
    ){

        return;

    }

    if(
        voiceAssistantRecording
    ){

        stopVoiceAssistantRecording();

    }else{

        startVoiceAssistantRecording();

    }

}


/* ============================================================
   START VOICE RECORDING
============================================================ */

async function startVoiceAssistantRecording(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            voiceStatus.innerText =
                "Microphone is not supported by this browser.";

            return;

        }

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });

        voiceAssistantRecorder =
            createCompatibleRecorder(
                stream
            );

        if(
            !voiceAssistantRecorder
        ){

            stream
                .getTracks()
                .forEach(
                    function(track){
                        track.stop();
                    }
                );

            voiceStatus.innerText =
                "Audio recording is not supported on this device.";

            return;

        }

        voiceAssistantChunks =
            [];

        voiceAssistantRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    voiceAssistantChunks.push(
                        event.data
                    );

                }

            };

        voiceAssistantRecorder.onstop =
            async function(){

                const mimeType =
                    voiceAssistantRecorder.mimeType ||
                    "audio/webm";

                const blob =
                    new Blob(
                        voiceAssistantChunks,
                        {
                            type:mimeType
                        }
                    );

                stream
                    .getTracks()
                    .forEach(
                        function(track){
                            track.stop();
                        }
                    );

                await processVoiceAssistantAudio(
                    blob
                );

            };

        voiceAssistantRecorder.start();

        voiceAssistantRecording =
            true;

        voiceMainBtn.classList.add(
            "recording"
        );

        voiceMainBtn.classList.remove(
            "processing"
        );

        voiceMainBtn.innerHTML =
            '<i class="fa-solid fa-stop"></i>';

        voiceOrb.classList.remove(
            "speaking"
        );

        voiceOrb.classList.add(
            "active",
            "listening"
        );

        voiceStatus.innerText =
            "Listening... Tap again when finished";

        voiceTranscript.innerHTML = `
            <div class="text-secondary">
                Listening...
            </div>
        `;

    }catch(error){

        console.error(
            "Voice Assistant microphone error:",
            error
        );

        voiceStatus.innerText =
            "Microphone permission denied or unavailable.";

    }

}


/* ============================================================
   STOP VOICE RECORDING
============================================================ */

function stopVoiceAssistantRecording(){

    if(
        voiceAssistantRecorder &&
        voiceAssistantRecording
    ){

        try{

            voiceAssistantRecorder.stop();

        }catch(error){}

    }

    voiceAssistantRecording =
        false;

    voiceMainBtn.classList.remove(
        "recording"
    );

    voiceMainBtn.innerHTML =
        '<i class="fa-solid fa-microphone"></i>';

    voiceOrb.classList.remove(
        "listening"
    );

    if(
        !voiceAssistantProcessing
    ){

        voiceOrb.classList.remove(
            "active"
        );

    }

}


/* ============================================================
   PROCESS VOICE
============================================================ */

async function processVoiceAssistantAudio(
    blob
){

    voiceAssistantProcessing =
        true;

    voiceMainBtn.classList.add(
        "processing"
    );

    voiceMainBtn.innerHTML =
        '<i class="fa-solid fa-circle-notch fa-spin"></i>';

    voiceStatus.innerText =
        "Converting your voice to text...";

    try{

        /* ====================================================
           STEP 1 — VOICE TO TEXT
        ==================================================== */

        const transcriptionForm =
            new FormData();

        transcriptionForm.append(
            "audio",
            blob,
            "voice-assistant.webm"
        );

        const transcriptionResponse =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:transcriptionForm
                }
            );

        if(
            !transcriptionResponse.ok
        ){

            throw new Error(
                "Transcription server error: " +
                transcriptionResponse.status
            );

        }

        const transcriptionData =
            await transcriptionResponse.json();

        if(
            transcriptionData.status !==
                "success" ||
            !transcriptionData.text
        ){

            throw new Error(
                transcriptionData.message ||
                "Voice transcription failed."
            );

        }

        const userText =
            transcriptionData.text.trim();


        /* ====================================================
           SHOW USER SPEECH
        ==================================================== */

        voiceTranscript.innerHTML = `
            <div class="voice-user-line">

                <strong>You:</strong><br>

                ${escapeHTML(
                    userText
                )}

            </div>

            <div class="text-secondary">

                Tuto AI is thinking...

            </div>
        `;


        /* ====================================================
           STEP 2 — SEND TEXT TO AI
        ==================================================== */

        voiceStatus.innerText =
            "Tuto AI is thinking...";

        const chatFormData =
            new FormData();

        chatFormData.append(
            "question",
            userText
        );

        chatFormData.append(
            "session_id",
            currentSessionId
        );

        const chatResponse =
            await fetch(
                "/api/chat",
                {
                    method:"POST",
                    body:chatFormData
                }
            );

        if(
            !chatResponse.ok
        ){

            throw new Error(
                "AI server error: " +
                chatResponse.status
            );

        }

        const chatData =
            await chatResponse.json();

        if(
            chatData.status !==
                "success"
        ){

            throw new Error(
                chatData.message ||
                "AI response failed."
            );

        }

        const answer =
            chatData.response ||
            "Sorry, I couldn't answer that.";


        /* ====================================================
           SHOW ANSWER IN VOICE WINDOW
        ==================================================== */

        voiceTranscript.innerHTML = `

            <div class="voice-user-line">

                <strong>You:</strong><br>

                ${escapeHTML(
                    userText
                )}

            </div>

            <div class="voice-ai-line">

                <strong>Tuto AI:</strong><br>

                ${escapeHTML(
                    answer
                )}

            </div>

        `;


        /* ====================================================
           IMPORTANT:
           SAVE VOICE CHAT INTO CURRENT NEW CHAT
        ==================================================== */

        if(
            allSessions[
                currentSessionId
            ]
        ){

            const voiceUserHTML = `
                <div class="message">

                    <div class="avatar user-avatar">
                        You
                    </div>

                    <div class="bubble">

                        <strong>You</strong><br>

                        ${escapeHTML(
                            userText
                        ).replace(
                            /\n/g,
                            "<br>"
                        )}

                    </div>

                </div>
            `;

            const voiceAIHTML = `
                <div class="message">

                    <div class="avatar ai-avatar">
                        AI
                    </div>

                    <div class="bubble">

                        <div
                            class="d-flex
                            justify-content-between
                            align-items-center
                            mb-1">

                            <strong>
                                Tuto AI
                            </strong>

                            <button
                                class="tts-btn"
                                onclick="speakText(this)"
                                title="Read Aloud">

                                <i class="fa-solid fa-volume-high"></i>

                            </button>

                        </div>

                        <div>
                            ${marked.parse(
                                answer
                            )}
                        </div>

                    </div>

                </div>
            `;

            chatBox.innerHTML +=
                voiceUserHTML +
                voiceAIHTML;

            processExistingChatContent();

            allSessions[
                currentSessionId
            ].html =
                chatBox.innerHTML;

            allSessions[
                currentSessionId
            ].updatedAt =
                Date.now();

            await saveSession(
                allSessions[
                    currentSessionId
                ]
            );

            renderSidebarHistory();

        }


        /* ====================================================
           STEP 3 — AI TEXT TO SPEECH
        ==================================================== */

        voiceStatus.innerText =
            "Tuto AI is speaking...";

        speakVoiceAssistant(
            answer
        );

    }catch(error){

        console.error(
            "Voice Assistant error:",
            error
        );

        voiceStatus.innerText =
            "Something went wrong. Please try again.";

        voiceTranscript.innerHTML = `

            <div class="text-danger">

                ${escapeHTML(
                    error.message ||
                    "Voice Assistant error."
                )}

            </div>

        `;

    }finally{

        voiceAssistantProcessing =
            false;

        voiceMainBtn.classList.remove(
            "processing"
        );

        voiceMainBtn.innerHTML =
            '<i class="fa-solid fa-microphone"></i>';

    }

}


/* ============================================================
   VOICE ASSISTANT TEXT TO SPEECH
============================================================ */

function speakVoiceAssistant(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        voiceStatus.innerText =
            "Voice output is not supported on this device.";

        return;

    }

    window.speechSynthesis.cancel();


    /* ========================================================
       CLEAN MARKDOWN
    ======================================================== */

    const cleanText =
        String(text)

        .replace(
            /```[\s\S]*?```/g,
            ""
        )

        .replace(
            /[*_#>`]/g,
            ""
        )

        .replace(
            /$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\[\^\)\]\+$end:math:text$/g,
            "$1"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();


    if(!cleanText){

        voiceStatus.innerText =
            "Nothing to speak.";

        return;

    }


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    /* ========================================================
       LANGUAGE
    ======================================================== */

    const isBangla =
        /[\u0980-\u09FF]/.test(
            cleanText
        );

    utterance.lang =
        isBangla
        ? "bn-BD"
        : "en-US";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    /* ========================================================
       FIND VOICE
    ======================================================== */

    let voices =
        window.speechSynthesis
        .getVoices();

    if(
        !voices ||
        !voices.length
    ){

        /*
         * iOS/Safari may load voices asynchronously.
         * The utterance itself will still use the
         * system default voice.
         */

        voices = [];

    }


    if(voices.length){

        const preferredVoice =
            voices.find(
                function(voice){

                    const lang =
                        String(
                            voice.lang || ""
                        ).toLowerCase();

                    if(isBangla){

                        return (
                            lang === "bn-bd" ||
                            lang.startsWith(
                                "bn"
                            )
                        );

                    }

                    return (
                        lang.startsWith(
                            "en"
                        )
                    );

                }
            );

        if(preferredVoice){

            utterance.voice =
                preferredVoice;

        }

    }


    /* ========================================================
       SPEECH START
    ======================================================== */

    utterance.onstart =
        function(){

            voiceOrb.classList.remove(
                "listening"
            );

            voiceOrb.classList.add(
                "active",
                "speaking"
            );

            voiceStatus.innerText =
                "Tuto AI is speaking...";

        };


    /* ========================================================
       SPEECH END
    ======================================================== */

    utterance.onend =
        function(){

            voiceOrb.classList.remove(
                "speaking",
                "active"
            );

            voiceStatus.innerText =
                "Tap the microphone to speak again.";

            voiceMainBtn.classList.remove(
                "processing",
                "recording"
            );

            voiceMainBtn.innerHTML =
                '<i class="fa-solid fa-microphone"></i>';

        };


    /* ========================================================
       SPEECH ERROR
    ======================================================== */

    utterance.onerror =
        function(event){

            console.error(
                "Speech synthesis error:",
                event
            );

            voiceOrb.classList.remove(
                "speaking",
                "active"
            );

            voiceStatus.innerText =
                "Voice playback failed. Tap the microphone to try again.";

        };


    /* ========================================================
       SPEAK
    ======================================================== */

    /*
     * Small delay helps Safari/iOS initialize the
     * speech engine after microphone usage.
     */

    setTimeout(
        function(){

            window.speechSynthesis.speak(
                utterance
            );

        },
        100
    );

}


/* ============================================================
   LOAD VOICES
============================================================ */

if(
    "speechSynthesis" in window
){

    window.speechSynthesis.onvoiceschanged =
        function(){

            window.speechSynthesis
                .getVoices();

        };

}


/* ============================================================
   CLOSE VOICE OVERLAY OUTSIDE
============================================================ */

if(voiceOverlay){

    voiceOverlay.addEventListener(
        "click",
        function(e){

            if(
                e.target ===
                voiceOverlay
            ){

                closeVoiceAssistant();

            }

        }
    );

}


/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "Escape"
        ){

            if(
                typeof hideContextMenu ===
                "function"
            ){

                hideContextMenu();

            }

            if(
                voiceOverlay &&
                voiceOverlay.classList.contains(
                    "show"
                )
            ){

                closeVoiceAssistant();

            }

        }

    }
);


/* ============================================================
   INITIAL SEND BUTTON
============================================================ */

updateSendButton();


/* ============================================================
   INITIALIZE DATABASE + SESSIONS
============================================================ */

openDatabase()
    .then(
        function(){

            return initializeSessions();

        }
    )
    .catch(
        function(error){

            console.error(
                "Database initialization error:",
                error
            );

            initializeSessions();

        }
    );
