<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Tuto AI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script

    </script>

    <script
        defer

    </script>

    <!-- Markdown -->
    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>

    <!-- Highlight.js -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js">
    </script>


<style>

/* ============================================================
   THEME
============================================================ */

:root[data-theme="dark"] {

    --bg-color:#131314;
    --sidebar-bg:#1e1e20;
    --text-color:#ffffff;
    --text-muted:#b8b8b8;
    --accent-color:#a8c7fa;
    --border-color:#2d2d30;
    --input-bg:#1e1e20;
    --input-border:#3c4043;
    --btn-hover:#2b2a33;
    --bubble-text:#ffffff;
    --strong-color:#a8c7fa;
    --modal-bg:#1e1e20;

}

:root[data-theme="light"] {

    --bg-color:#ffffff;
    --sidebar-bg:#f0f4f9;
    --text-color:#1f1f1f;
    --text-muted:#555555;
    --accent-color:#0b57d0;
    --border-color:#e1e3e1;
    --input-bg:#f0f4f9;
    --input-border:#c4c7c5;
    --btn-hover:#e3e3e3;
    --bubble-text:#1f1f1f;
    --strong-color:#0b57d0;
    --modal-bg:#ffffff;

}

* {
    box-sizing:border-box;
}

html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:var(--bg-color);
    color:var(--text-color);

    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;
}

body {
    display:flex;
}


/* ============================================================
   SIDEBAR
============================================================ */

.sidebar {

    width:260px;
    height:100%;

    background:var(--sidebar-bg);

    border-right:
        1px solid var(--border-color);

    padding:20px;

    display:flex;
    flex-direction:column;

    flex-shrink:0;

    transition:
        all .3s ease;

    z-index:1000;

}

.sidebar.collapsed {

    margin-left:-260px;

}

.sidebar-overlay {

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.5);

    z-index:999;

}

.new-chat-btn {

    background:var(--input-bg);

    color:var(--text-color);

    border:
        1px solid var(--border-color);

    border-radius:30px;

    padding:10px 15px;

    font-weight:500;

    transition:.2s;

}

.new-chat-btn:hover {

    background:var(--btn-hover);

}

.history-list {

    flex:1;

    overflow-y:auto;

    margin-top:15px;

    margin-bottom:15px;

}

.history-item {

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 12px;

    border-radius:10px;

    color:var(--text-muted);

    cursor:pointer;

    font-size:14px;

    margin-bottom:5px;

    user-select:none;

    position:relative;

}

.history-item:hover,
.history-item.active {

    background:var(--btn-hover);

    color:var(--text-color);

}

.history-title {

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    max-width:150px;

}

.action-btns-group {

    display:none;

    align-items:center;

    gap:6px;

}

.history-item.show-actions
.action-btns-group {

    display:flex;

}

.action-icon-btn {

    border:none;

    background:transparent;

    font-size:13px;

    cursor:pointer;

    padding:3px 5px;

}

.delete-btn-icon {

    color:#e11d48;

}

.star-btn-icon {

    color:#f59e0b;

}

.is-pinned-icon {

    color:#f59e0b;

    font-size:12px;

    margin-left:4px;

}


/* ============================================================
   MAIN
============================================================ */

.main-chat {

    flex:1;

    width:100%;

    height:100vh;

    height:100dvh;

    display:flex;

    flex-direction:column;

    overflow:hidden;

}

.chat-header {

    padding:15px 25px;

    border-bottom:
        1px solid var(--border-color);

    display:flex;

    align-items:center;

    justify-content:space-between;

    flex-shrink:0;

}

.header-left {

    display:flex;

    align-items:center;

}

.toggle-btn,
.theme-btn {

    background:transparent;

    border:none;

    color:var(--text-color);

    cursor:pointer;

    padding:7px 12px;

    border-radius:20px;

}

.toggle-btn:hover,
.theme-btn:hover {

    background:var(--btn-hover);

}

.theme-btn {

    border:
        1px solid var(--border-color);

    font-size:14px;

}


/* ============================================================
   CHAT
============================================================ */

.chat-container {

    flex:1;

    overflow-y:auto;

    padding:20px;

    width:100%;

    max-width:900px;

    margin:0 auto;

}

.welcome-screen {

    min-height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

}

.welcome-avatar {

    width:58px;

    height:58px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-weight:bold;

    font-size:22px;

    margin-bottom:15px;

}

.message {

    display:flex;

    gap:15px;

    margin-bottom:28px;

}

.avatar {

    width:35px;

    height:35px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-shrink:0;

    font-size:13px;

    font-weight:bold;

}

.user-avatar {

    background:#5436da;

    color:white;

}

.ai-avatar {

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    color:white;

}

.bubble {

    width:100%;

    max-width:88%;

    color:var(--bubble-text);

    font-size:16px;

    line-height:1.65;

    word-wrap:break-word;

}

.bubble strong {

    color:var(--strong-color);

}

.bubble table {

    width:100%;

    border-collapse:collapse;

    margin:12px 0;

}

.bubble th,
.bubble td {

    border:
        1px solid var(--border-color);

    padding:8px;

}

.bubble th {

    background:var(--btn-hover);

}


/* ============================================================
   CODE
============================================================ */

.code-container {

    margin:12px 0;

    border-radius:8px;

    overflow:hidden;

    border:
        1px solid #3e4451;

    background:#282c34;

}

.code-header {

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#21252b;

    padding:6px 12px;

    font-size:12px;

    color:#abb2bf;

}

pre {

    margin:0 !important;

    padding:12px !important;

    overflow-x:auto;

}

.copy-code-btn {

    background:#3e4451;

    color:white;

    border:none;

    border-radius:4px;

    padding:3px 8px;

    font-size:12px;

    cursor:pointer;

}


/* ============================================================
   FILE PREVIEW
============================================================ */

.uploaded-img-preview {

    max-width:220px;

    max-height:320px;

    object-fit:contain;

    border-radius:10px;

    border:
        1px solid var(--border-color);

    margin-bottom:8px;

}

.pdf-badge {

    display:inline-flex;

    align-items:center;

    gap:8px;

    background:var(--btn-hover);

    border:
        1px solid #e11d48;

    color:#ff4d4d;

    padding:7px 12px;

    border-radius:8px;

}


/* ============================================================
   INPUT
============================================================ */

.input-container-box {

    width:100%;

    padding:10px 15px 15px;

    background:var(--bg-color);

    flex-shrink:0;

}

.input-wrapper {

    width:100%;

    max-width:850px;

    margin:0 auto;

    background:var(--input-bg);

    border:
        1px solid var(--input-border);

    border-radius:24px;

    padding:8px 15px;

}

#filePreviewArea {

    display:none;

    position:relative;

    width:fit-content;

    margin-bottom:8px;

}

#previewImgThumb {

    width:70px;

    height:70px;

    object-fit:cover;

    border-radius:12px;

}

#pdfPreviewThumb {

    display:none;

    background:var(--btn-hover);

    border:
        1px solid #e11d48;

    color:#ff4d4d;

    padding:8px 12px;

    border-radius:10px;

    font-size:13px;

}

.close-img-btn {

    position:absolute;

    top:-7px;

    right:-7px;

    width:22px;

    height:22px;

    border:none;

    border-radius:50%;

    background:#e11d48;

    color:white;

    cursor:pointer;

}

.input-row {

    display:flex;

    align-items:center;

    gap:10px;

}

.plus-btn,
.mic-btn {

    background:none;

    border:none;

    color:var(--accent-color);

    font-size:18px;

    cursor:pointer;

    padding:5px;

}

.mic-btn.recording {

    color:#ef4444 !important;

    animation:pulse 1.2s infinite;

}

@keyframes pulse {

    0% {
        transform:scale(1);
    }

    50% {
        transform:scale(1.2);
    }

    100% {
        transform:scale(1);
    }

}

.chat-textarea {

    background:transparent;

    border:none;

    outline:none;

    color:var(--text-color);

    width:100%;

    resize:none;

    min-height:28px;

    max-height:120px;

    padding:6px 0;

    font-size:15px;

    font-family:inherit;

}

.send-btn {

    width:32px;

    height:32px;

    border-radius:50%;

    border:none;

    background:var(--text-color);

    color:var(--bg-color);

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    flex-shrink:0;

}

.send-btn:disabled {

    background:var(--border-color);

    color:var(--text-muted);

    cursor:not-allowed;

}

.tts-btn {

    background:none;

    border:none;

    color:var(--text-muted);

    cursor:pointer;

}


/* ============================================================
   MODAL
============================================================ */

.modal-content {

    background:var(--modal-bg);

    color:var(--text-color);

    border:
        1px solid var(--border-color);

}

.modal-btn {

    width:100%;

    padding:15px;

    margin-bottom:10px;

    border-radius:15px;

    border:
        1px solid var(--border-color);

    background:var(--input-bg);

    color:var(--text-color);

    text-align:left;

}

.modal-btn:hover {

    background:var(--btn-hover);

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:768px) {

    .sidebar {

        position:absolute;

        top:0;

        bottom:0;

        left:0;

        box-shadow:
            5px 0 15px rgba(0,0,0,.3);

    }

    .sidebar.collapsed {

        margin-left:-260px;

    }

    .sidebar-overlay.active {

        display:block;

    }

    .chat-container {

        padding:15px 10px;

    }

    .chat-header {

        padding:12px 15px;

    }

}

</style>

<body>


<!-- ============================================================
     SIDEBAR OVERLAY
============================================================ -->

<div

</div>


<!-- ============================================================
     SIDEBAR
============================================================ -->

<div
    class="sidebar"
    id="sidebar">


    <div
        class="d-flex justify-content-between align-items-center mb-3 d-md-none">

        <span class="fw-bold">

        </span>

        <button
            class="btn btn-sm text-secondary"

     MAIN

    <div class="chat-header">

<!-- ============================================================
     FILE INPUTS
============================================================ -->

<input

    id="galleryInput"
    accept="image/*"

    type="file"
    id="cameraInput"

<script>

/* ============================================================
   GLOBAL VARIABLES
============================================================ */

let selectedFile = null;

const questionInput =
    document.getElementById("question");

const chatBox =
    document.getElementById("chatBox");

const historyList =
    document.getElementById("historyList");

const micBtn =
    document.getElementById("micBtn");


/* ============================================================
   STORAGE SETTINGS
============================================================ */

/*
    IMPORTANT:

    Old version stored huge HTML inside localStorage.

    This version:
    - limits number of chats
    - limits each chat size
    - automatically removes oldest chats
    - catches quota errors
*/

const MAX_SESSIONS = 25;

const MAX_SESSION_SIZE = 180000;

const STORAGE_KEY =
    "tuto_all_sessions";

const CURRENT_KEY =
    "tuto_current_session_id";


/* ============================================================
   LOAD STORAGE SAFELY
============================================================ */

function loadSessionsSafely() {

    try {

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(!raw)
            return {};

        return JSON.parse(raw) || {};

    } catch(error) {

        console.warn(
            "Storage read error:",
            error
        );

        return {};

    }

}


let allSessions =
    loadSessionsSafely();


let currentSessionId =
    localStorage.getItem(
        CURRENT_KEY
    ) || null;


/* ============================================================
   STORAGE CLEANER
============================================================ */

function cleanSessionsForStorage() {

    const ids =
        Object.keys(allSessions);


    /*
        Remove extremely large sessions.
    */

    ids.forEach(id => {

        const session =
            allSessions[id];

        if(!session)
            return;


        let html =
            session.html || "";


        /*
            Remove image blob URLs from
            saved history.

            blob URLs are temporary anyway.
        */

        html =
            html.replace(
                /blob:[^"']+/g,
                ""
            );


        /*
            Limit session HTML.
        */

        if(
            html.length >
            MAX_SESSION_SIZE
        ) {

            html =
                html.slice(
                    -MAX_SESSION_SIZE
                );

        }


        session.html =
            html;

    });


    /*
        Keep only newest 25 chats.

        Pinned chats are kept first.
    */

    let sorted =
        ids.sort(
            (a,b) => {

                const aPin =
                    allSessions[a]?.isPinned
                    ? 1
                    : 0;

                const bPin =
                    allSessions[b]?.isPinned
                    ? 1
                    : 0;

                if(aPin !== bPin)
                    return bPin - aPin;

                return (
                    (allSessions[b]?.createdAt || 0)
                    -
                    (allSessions[a]?.createdAt || 0)
                );

            }
        );


    while(
        sorted.length >
        MAX_SESSIONS
    ) {

        const removeId =
            sorted.pop();


        if(
            removeId ===
            currentSessionId
        ) {

            continue;

        }


        delete allSessions[
            removeId
        ];

    }

}


/* ============================================================
   SAVE STORAGE
============================================================ */

function saveSessions() {

    cleanSessionsForStorage();


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(allSessions)
        );

        if(currentSessionId) {

            localStorage.setItem(
                CURRENT_KEY,
                currentSessionId
            );

        }

        return true;

    } catch(error) {

        console.warn(
            "LocalStorage full. Cleaning old chats...",
            error
        );


        /*
            Emergency cleanup:
            remove oldest non-pinned chats.
        */

        const ids =
            Object.keys(allSessions);


        ids.sort(
            (a,b) =>
                (allSessions[a]?.createdAt || 0)
                -
                (allSessions[b]?.createdAt || 0)
        );


        for(
            let i = 0;
            i < ids.length;
            i++
        ) {

            const id =
                ids[i];


            if(
                id === currentSessionId
            )
                continue;


            if(
                allSessions[id]?.isPinned
            )
                continue;


            delete allSessions[id];


            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(allSessions)
                );

                localStorage.setItem(
                    CURRENT_KEY,
                    currentSessionId
                );

                return true;

            } catch(e) {}

        }


        /*
            If still full,
            save only current chat.
        */

        try {

            const current =
                allSessions[
                    currentSessionId
                ];


            allSessions = {

                [currentSessionId]:
                    current

            };


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(allSessions)
            );

            localStorage.setItem(
                CURRENT_KEY,
                currentSessionId
            );

            return true;

        } catch(e) {

            /*
                Do not crash the app.
            */

            return false;

        }

    }

}


/* ============================================================
   THEME
============================================================ */

function initTheme() {

    const savedTheme =
        localStorage.getItem(
            "tuto_theme"
        ) || "dark";


    setTheme(savedTheme);

}


function toggleTheme() {

    const current =
        document.documentElement
        .getAttribute(
            "data-theme"
        );


    setTheme(
        current === "dark"
            ? "light"
            : "dark"
    );

}


function setTheme(theme) {

    document.documentElement
        .setAttribute(
            "data-theme",
            theme
        );


    localStorage.setItem(
        "tuto_theme",
        theme
    );


    const icon =
        document.getElementById(
            "themeIcon"
        );


    const text =
        document.getElementById(
            "themeText"
        );


    if(theme === "light") {

        icon.className =
            "fa-solid fa-moon";

        text.innerText =
            "Dark";

    } else {

        icon.className =
            "fa-solid fa-sun";

        text.innerText =
            "Light";

    }

}


/* ============================================================
   SIDEBAR
============================================================ */

function toggleSidebar() {

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const overlay =
        document.getElementById(
            "sidebarOverlay"
        );


    sidebar.classList.toggle(
        "collapsed"
    );


    if(
        window.innerWidth <= 768
    ) {

        if(
            !sidebar.classList.contains(
                "collapsed"
            )
        ) {

            overlay.classList.add(
                "active"
            );

        } else {

            overlay.classList.remove(
                "active"
            );

        }

    }

}


function mobileSidebarCheck() {

    if(
        window.innerWidth <= 768
    ) {

        document
            .getElementById("sidebar")
            .classList.add(
                "collapsed"
            );

    }

}

/* ============================================================
   MATH
============================================================ */

function renderMath(element) {

    if(
        window.renderMathInElement
    ) {

        try {

            renderMathInElement(
                element,
                {

                    delimiters:[

                        {
                            left:"$$",
                            right:"$$",
                            display:true
                        },

                        {
                            left:"$",
                            right:"$",
                            display:false
                        },

                        {
                            left:"\\(",
                            right:"\\)",
                            display:false
                        },

                        {
                            left:"\\[",
                            right:"\\]",
                            display:true
                        }

                    ],

                    throwOnError:false

                }
            );

        } catch(e) {}

    }

}


/* ============================================================
   CODE BLOCKS
============================================================ */

function processCodeBlocks(element) {

    if(!element)
        return;


    element
        .querySelectorAll("pre")
        .forEach(
            pre => {

                if(
                    pre.closest(
                        ".code-container"
                    )
                )
                    return;


                const code =
                    pre.querySelector(
                        "code"
                    );


                const codeText =
                    code
                        ? code.innerText
                        : pre.innerText;


                let language =
                    "code";


                if(
                    code &&
                    code.className
                ) {

                    const match =
                        code.className.match(
                            /language-(\w+)/
                        );


                    if(match)
                        language =
                            match[1];

                }


                const container =
                    document.createElement(
                        "div"
                    );


                container.className =
                    "code-container";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "code-header";


                const label =
                    document.createElement(
                        "span"
                    );


                label.innerText =
                    language;


                const copyBtn =
                    document.createElement(
                        "button"
                    );


                copyBtn.className =
                    "copy-code-btn";


                copyBtn.innerHTML =
                    '<i class="fa-regular fa-copy"></i> Copy';


                copyBtn.onclick =
                    async function() {

                        try {

                            await navigator
                                .clipboard
                                .writeText(
                                    codeText.trim()
                                );


                            copyBtn.innerHTML =
                                '<i class="fa-solid fa-check"></i> Copied!';


                            setTimeout(
                                () => {

                                    copyBtn.innerHTML =
                                        '<i class="fa-regular fa-copy"></i> Copy';

                                },
                                2000
                            );

                        } catch(e) {}

                    };


                header.appendChild(
                    label
                );

                header.appendChild(
                    copyBtn
                );


                pre.parentNode.insertBefore(
                    container,
                    pre
                );


                container.appendChild(
                    header
                );

                container.appendChild(
                    pre
                );


                if(
                    window.hljs &&
                    code
                ) {

                    try {

                        hljs.highlightElement(
                            code
                        );

                    } catch(e) {}

                }

            }
        );

}


/* ============================================================
   NEW CHAT
============================================================ */

function startNewChat(
    render = true
) {

    currentSessionId =
        "session_" +
        Date.now();


    allSessions[
        currentSessionId
    ] = {

        title:"New Chat",

        html:DEFAULT_WELCOME,

        isPinned:false,

        createdAt:Date.now()

    };


    saveSessions();


    if(render) {

        renderSidebarHistory();

        loadSession(
            currentSessionId
        );

    }


    mobileSidebarCheck();

}


/* ============================================================
   LOAD SESSION
============================================================ */

function loadSession(id) {

    if(
        !allSessions[id]
    )
        return;


    currentSessionId =
        id;


    saveSessions();


    chatBox.innerHTML =
        allSessions[id].html ||
        DEFAULT_WELCOME;


    chatBox
        .querySelectorAll(".bubble")
        .forEach(
            bubble => {

                renderMath(
                    bubble
                );

                processCodeBlocks(
                    bubble
                );

            }
        );


    chatBox.scrollTop =
        chatBox.scrollHeight;


    renderSidebarHistory();

}


/* ============================================================
   DELETE SESSION
============================================================ */

function deleteSession(
    event,
    id
) {

    event.stopPropagation();


    if(
        !confirm(
            "Delete this chat?"
        )
    )
        return;


    delete allSessions[id];


    const keys =
        Object.keys(
            allSessions
        );


    if(
        currentSessionId === id
    ) {

        if(keys.length) {

            /*
                Open newest chat.
            */

            keys.sort(
                (a,b) =>
                    (
                        allSessions[b]
                        ?.createdAt || 0
                    )
                    -
                    (
                        allSessions[a]
                        ?.createdAt || 0
                    )
            );


            currentSessionId =
                keys[0];

        } else {

            startNewChat(false);

        }

    }


    saveSessions();

    renderSidebarHistory();

    loadSession(
        currentSessionId
    );

}


/* ============================================================
   PIN
============================================================ */

function togglePin(
    event,
    id
) {

    event.stopPropagation();


    if(
        allSessions[id]
    ) {

        allSessions[id].isPinned =
            !allSessions[id].isPinned;


        saveSessions();

        renderSidebarHistory();

    }

}


/* ============================================================
   RENAME CHAT
============================================================ */

function renameSession(
    event,
    id
) {

    event.stopPropagation();


    if(
        !allSessions[id]
    )
        return;


    const oldTitle =
        allSessions[id].title ||
        "New Chat";


    const newTitle =
        prompt(
            "Rename chat:",
            oldTitle
        );


    if(
        newTitle === null
    )
        return;


    const title =
        newTitle.trim();


    if(!title)
        return;


    allSessions[id].title =
        title.slice(
            0,
            80
        );


    saveSessions();

    renderSidebarHistory();

}


/* ============================================================
   SIDEBAR HISTORY
============================================================ */

function renderSidebarHistory() {

    historyList.innerHTML = "";


    const keys =
        Object.keys(
            allSessions
        );


    keys.sort(
        (a,b) =>
            (
                allSessions[b]
                ?.createdAt || 0
            )
            -
            (
                allSessions[a]
                ?.createdAt || 0
            )
    );


    const pinned =
        keys.filter(
            id =>
                allSessions[id]
                ?.isPinned
        );


    const recent =
        keys.filter(
            id =>
                !allSessions[id]
                ?.isPinned
        );


    if(pinned.length) {

        historyList.innerHTML += `

            <div
                class="text-warning small fw-bold mt-2 mb-1">

                <i class="fa-solid fa-star me-1"></i>

                PINNED CHATS

            </div>

        `;


        pinned.forEach(
            id =>
                renderHistoryItem(id)
        );

    }


    if(recent.length) {

        historyList.innerHTML += `

            <div
                class="text-secondary small fw-bold mt-3 mb-1">

                RECENT CHATS

            </div>

        `;


        recent.forEach(
            id =>
                renderHistoryItem(id)
        );

    }

}


/* ============================================================
   HISTORY ITEM
============================================================ */

function renderHistoryItem(id) {

    const session =
        allSessions[id];


    if(!session)
        return;


    const active =
        id === currentSessionId
            ? "active"
            : "";


    const star =
        session.isPinned
            ? "fa-solid fa-star"
            : "fa-regular fa-star";


    /*
        Long press support.
    */

    historyList.innerHTML += `

        <div
            class="history-item ${active}"
            data-id="${escapeHTML(id)}"
            onclick="loadSession('${id}')"
            oncontextmenu="showChatActions(event,'${id}')">

            <div class="history-title">

                <i
                    class="fa-regular fa-message me-2">
                </i>

                ${escapeHTML(
                    session.title ||
                    "New Chat"
                )}

                ${
                    session.isPinned
                    ?
                    '<i class="fa-solid fa-star is-pinned-icon"></i>'
                    :
                    ''
                }

            </div>


            <div class="action-btns-group">

                <button
                    class="action-icon-btn delete-btn-icon"
                    onclick="deleteSession(event,'${id}')">

                    <i
                        class="fa-solid fa-trash-can">
                    </i>

                </button>


                <button
                    class="action-icon-btn star-btn-icon"
                    onclick="togglePin(event,'${id}')">

                    <i
                        class="${star}">
                    </i>

                </button>


                <button
                    class="action-icon-btn"
                    onclick="renameSession(event,'${id}')">

                    <i
                        class="fa-solid fa-pen">
                    </i>

                </button>

            </div>

        </div>

    `;

}


/* ============================================================
   CHAT ACTION MENU
============================================================ */

let chatActionTimer = null;


function showChatActions(
    event,
    id
) {

    event.preventDefault();


    document
        .querySelectorAll(
            ".history-item"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "show-actions"
                )
        );


    const item =
        event.currentTarget;


    item.classList.add(
        "show-actions"
    );

}


/* ============================================================
   LONG PRESS
============================================================ */

document.addEventListener(
    "touchstart",
    function(e) {

        const item =
            e.target.closest(
                ".history-item"
            );


        if(!item)
            return;


        const id =
            item.dataset.id;


        chatActionTimer =
            setTimeout(
                () => {

                    document
                        .querySelectorAll(
                            ".history-item"
                        )
                        .forEach(
                            el =>
                                el.classList.remove(
                                    "show-actions"
                                )
                        );


                    item.classList.add(
                        "show-actions"
                    );

                },
                600
            );

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchend",
    function() {

        if(chatActionTimer) {

            clearTimeout(
                chatActionTimer
            );

            chatActionTimer =
                null;

        }

    },
    {
        passive:true
    }
);


/* ============================================================
   SAFE HTML
============================================================ */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.innerText =
        text || "";


    return div.innerHTML;

}


/* ============================================================
   VOICE RECORDING
============================================================ */

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


async function toggleVoiceRecording() {

    if(isRecording) {

        stopRecording();

    } else {

        startRecording();

    }

}


async function startRecording() {

    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        audioChunks = [];


        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                await transcribeAudio(
                    blob
                );

            };


        mediaRecorder.start();


        isRecording = true;


        micBtn.classList.add(
            "recording"
        );


        questionInput.placeholder =
            "Recording... Tap microphone to stop";

    } catch(error) {

        alert(
            "Microphone permission denied or unavailable."
        );

    }

}


function stopRecording() {

    if(
        mediaRecorder &&
        isRecording
    ) {

        mediaRecorder.stop();

        isRecording = false;

        micBtn.classList.remove(
            "recording"
        );

        questionInput.placeholder =
            "Processing voice...";

    }

}


/* ============================================================
   TRANSCRIBE
============================================================ */

async function transcribeAudio(
    blob
) {

    const formData =
        new FormData();


    formData.append(
        "audio",
        blob,
        "audio.webm"
    );


    try {

        const response =
            await fetch(
                "/api/transcribe",
                {
                    method:"POST",
                    body:formData
                }
            );


        const data =
            await response.json();


        if(
            data.status === "success" &&
            data.text
        ) {

            questionInput.value =
                data.text;


            questionInput.style.height =
                "auto";


            questionInput.style.height =
                Math.min(
                    questionInput.scrollHeight,
                    120
                ) + "px";

        } else {

            alert(
                data.message ||
                "Voice recognition failed."
            );

        }

    } catch(error) {

        alert(
            "Could not connect to voice service."
        );

    } finally {

        questionInput.placeholder =
            "Message Tuto AI...";

    }

}

/* ============================================================
   FILE SELECT
============================================================ */

function handleFileSelect(
    input
) {

    if(
        !input.files ||
        !input.files[0]
    )
        return;


    selectedFile =
        input.files[0];


    const previewArea =
        document.getElementById(
            "filePreviewArea"
        );


    const imageThumb =
        document.getElementById(
            "previewImgThumb"
        );


    const pdfThumb =
        document.getElementById(
            "pdfPreviewThumb"
        );


    if(
        selectedFile.type ===
        "application/pdf"
    ) {

        imageThumb.style.display =
            "none";


        pdfThumb.style.display =
            "inline-block";


        document.getElementById(
            "pdfFileName"
        ).innerText =
            selectedFile.name;

    } else {

        pdfThumb.style.display =
            "none";


        imageThumb.style.display =
            "block";


        /*
            Object URL only exists
            during this page session.
        */

        imageThumb.src =
            URL.createObjectURL(
                selectedFile
            );

    }


    previewArea.style.display =
        "block";

}

/* ============================================================
   TEXT TO SPEECH
============================================================ */

function speakText(button) {

    if(
        !("speechSynthesis" in window)
    ) {

        alert(
            "Voice output is not supported."
        );

        return;

    }


    const bubble =
        button.closest(
            ".bubble"
        );


    const text =
        bubble
            ? bubble.innerText
            : "";


    if(
        window.speechSynthesis.speaking
    ) {

        window.speechSynthesis.cancel();


        button.innerHTML =
            '<i class="fa-solid fa-volume-high"></i>';


        return;

    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    if(
        /[\u0980-\u09FF]/.test(
            text
        )
    ) {

        utterance.lang =
            "bn-BD";

    } else {

        utterance.lang =
            "en-US";

    }


    button.innerHTML =
        '<i class="fa-solid fa-volume-xmark text-warning"></i>';


    utterance.onend =
        () => {

            button.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

        };


    window.speechSynthesis.speak(
        utterance
    );

}


/* ============================================================
   SEND MESSAGE
============================================================ */

document
    .getElementById(
        "chatForm"
    )
    .addEventListener(
        "submit",
        async function(e) {

            e.preventDefault();


            const sendBtn =
                document.getElementById(
                    "sendBtn"
                );


            const question =
                questionInput.value.trim();


            if(
                !question &&
                !selectedFile
            )
                return;


            /*
                Remove welcome screen.
            */

            if(
                chatBox.querySelector(
                    ".welcome-screen"
                )
            ) {

                chatBox.innerHTML =
                    "";

            }


            /* =================================================
               USER MESSAGE
            ================================================= */

            let userHTML = "";


            if(question) {

                userHTML += `

                    <strong>
                        You
                    </strong>

                    <br>

                    ${escapeHTML(question)
                        .replace(
                            /\n/g,
                            "<br>"
                        )}

                `;

            }


            if(selectedFile) {

                if(
                    selectedFile.type ===
                    "application/pdf"
                ) {

                    userHTML =
                        `
                        <div class="pdf-badge">

                            <i
                                class="fa-solid fa-file-pdf">
                            </i>

                            ${escapeHTML(
                                selectedFile.name
                            )}

                        </div>
                        `
                        +
                        (
                            userHTML
                                ? "<br>" +
                                  userHTML
                                : ""
                        );

                } else {

                    /*
                        IMPORTANT:
                        This image is NOT converted
                        to base64 and NOT saved in
                        localStorage.
                    */

                    const url =
                        URL.createObjectURL(
                            selectedFile
                        );


                    userHTML =
                        `
                        <img
                            src="${url}"
                            class="uploaded-img-preview"
                        >
                        `
                        +
                        (
                            userHTML
                                ? "<br>" +
                                  userHTML
                                : ""
                        );

                }

            }


            chatBox.innerHTML += `

                <div class="message">

                    <div class="avatar user-avatar">
                        You
                    </div>

                    <div class="bubble">

                        ${userHTML}

                    </div>

                </div>

            `;


            /* =================================================
               FORMDATA
            ================================================= */

            const formData =
                new FormData();


            formData.append(
                "question",
                question
            );


            formData.append(
                "session_id",
                currentSessionId
            );


            if(selectedFile) {

                formData.append(
                    "file",
                    selectedFile
                );

            }


            /*
                Clear input AFTER FormData
                has been created.
            */

            questionInput.value = "";

            questionInput.style.height =
                "auto";


            clearSelectedFile();


            sendBtn.disabled =
                true;


            chatBox.scrollTop =
                chatBox.scrollHeight;


            /* =================================================
               LOADING
            ================================================= */

            const loadingId =
                "loading-" +
                Date.now();


            chatBox.innerHTML += `

                <div
                    class="message"
                    id="${loadingId}">

                    <div class="avatar ai-avatar">
                        AI
                    </div>

                    <div
                        class="bubble text-secondary">

                        <i
                            class="fa-solid fa-circle-notch fa-spin me-2">
                        </i>

                        Thinking...

                    </div>

                </div>

            `;


            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method:"POST",
                            body:formData
                        }
                    );


                const data =
                    await response.json();


                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(
                    data.status ===
                    "success"
                ) {

                    let content =
                        data.response || "";


                    try {

                        content =
                            marked.parse(
                                content
                            );

                    } catch(e) {

                        content =
                            escapeHTML(
                                data.response
                            ).replace(
                                /\n/g,
                                "<br>"
                            );

                    }


                    const bubble =
                        loading
                            .querySelector(
                                ".bubble"
                            );


                    bubble.innerHTML = `

                        <div
                            class="d-flex
                                   justify-content-between
                                   align-items-center
                                   mb-1">

                            <strong>
                                Tuto AI
                            </strong>


                            <button
                                class="tts-btn"
                                onclick="speakText(this)"
                                title="Read Aloud">

                                <i
                                    class="fa-solid fa-volume-high">
                                </i>

                            </button>

                        </div>


                        <div>

                            ${content}

                        </div>

                    `;


                    processCodeBlocks(
                        bubble
                    );


                    renderMath(
                        bubble
                    );


                    /*
                        Save chat safely.
                    */

                    if(
                        allSessions[
                            currentSessionId
                        ]
                    ) {

                        allSessions[
                            currentSessionId
                        ].html =
                            chatBox.innerHTML;


                        saveSessions();

                    }


                    /*
                        Generate title.
                    */

                    if(
                        allSessions[
                            currentSessionId
                        ] &&
                        allSessions[
                            currentSessionId
                        ].title ===
                        "New Chat"
                    ) {

                        generateTitle(
                            question ||
                            selectedFile?.name ||
                            "Conversation"
                        );

                    }

                } else {

                    if(loading) {

                        loading
                            .querySelector(
                                ".bubble"
                            )
                            .innerHTML = `

                                <span
                                    class="text-danger">

                                    Error:
                                    ${escapeHTML(
                                        data.message ||
                                        "Something went wrong."
                                    )}

                                </span>

                            `;

                    }

                }

            } catch(error) {

                const loading =
                    document.getElementById(
                        loadingId
                    );


                if(loading) {

                    loading
                        .querySelector(
                            ".bubble"
                        )
                        .innerHTML = `

                            <span
                                class="text-danger">

                                Server connection error.

                            </span>

                        `;

                }

            } finally {

                sendBtn.disabled =
                    false;


                chatBox.scrollTop =
                    chatBox.scrollHeight;

            }

        }
    );


/* ============================================================
   SMART TITLE
============================================================ */

async function generateTitle(
    prompt
) {

    try {

        const response =
            await fetch(
                "/api/generate-title",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt:prompt
                        })

                }
            );


        const data =
            await response.json();


        if(
            data.status ===
                "success" &&
            data.title &&
            allSessions[
                currentSessionId
            ]
        ) {

            allSessions[
                currentSessionId
            ].title =
                data.title;


            saveSessions();

            renderSidebarHistory();

        }

    } catch(error) {

        console.warn(
            "Title generation failed:",
            error
        );

    }

}


/* ============================================================
   HIDE CHAT ACTIONS WHEN CLICKING OUTSIDE
============================================================ */

document.addEventListener(
    "click",
    function(e) {

        if(
            !e.target.closest(
                ".history-item"
            )
        ) {

            document
                .querySelectorAll(
                    ".history-item"
                )
                .forEach(
                    item =>
                        item.classList.remove(
                            "show-actions"
                        )
                );

        }

    }
);


/* ============================================================
   PERIODIC STORAGE CLEANUP
============================================================ */

setInterval(
    () => {

        try {

            cleanSessionsForStorage();

            saveSessions();

        } catch(e) {}

    },
    60000
);

</script>
